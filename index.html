<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Phân Việc & Tính KPI - 30 Nhân Viên</title>
    
    <!-- React & ReactDOM (CDNs an toàn tuyệt đối) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel compiler -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --primary-border: #bfdbfe;
            --success: #10b981;
            --success-light: #ecfdf5;
            --success-dark: #047857;
            --warning: #f59e0b;
            --warning-light: #fffbeb;
            --warning-dark: #b45309;
            --danger: #ef4444;
            --danger-light: #fef2f2;
            --danger-dark: #b91c1c;
            --dark-900: #0f172a;
            --dark-800: #1e293b;
            --dark-700: #334155;
            --gray-400: #94a3b8;
            --gray-300: #cbd5e1;
            --gray-200: #e2e8f0;
            --gray-100: #f1f5f9;
            --gray-50: #f8fafc;
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-full: 9999px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --font: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            background-color: #f3f4f6;
            color: var(--dark-800);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* --- LAYOUT CHÍNH --- */
        .app-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        .app-header {
            background: linear-gradient(135deg, var(--dark-900) 0%, #1e1b4b 100%);
            color: white;
            padding: 16px 24px;
            box-shadow: var(--shadow-lg);
        }

        .header-content {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-icon {
            background-color: var(--primary);
            color: white;
            padding: 10px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .logo-text h1 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .logo-text p {
            font-size: 0.75rem;
            color: var(--gray-300);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: var(--radius-full);
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Điều khiển Đăng nhập */
        .auth-controls {
            display: flex;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.07);
            padding: 6px 12px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 255, 255, 0.1);
            gap: 12px;
        }

        .auth-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--gray-300);
            text-transform: uppercase;
        }

        .role-btn {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .role-btn:hover {
            background-color: var(--danger-dark);
        }

        .user-select {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            outline: none;
            cursor: pointer;
        }

        .user-select option {
            background-color: var(--dark-800);
            color: white;
        }

        /* Menu Điều Hướng */
        .navigation-bar {
            background-color: white;
            border-bottom: 1px solid var(--gray-200);
            box-shadow: var(--shadow-sm);
        }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .active-user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--dark-700);
            padding: 12px 0;
        }

        .badge-pill {
            background-color: var(--primary-light);
            color: var(--primary);
            padding: 2px 8px;
            border-radius: var(--radius-sm);
            font-size: 0.7rem;
            font-weight: 700;
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 8px 0;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--dark-700);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn:hover {
            background-color: var(--gray-100);
            color: var(--dark-900);
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        /* Live Feed */
        .live-feed-bar {
            background-color: #eff6ff;
            border-bottom: 1px solid #dbeafe;
            padding: 8px 24px;
        }

        .live-feed-content {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            gap: 16px;
        }

        .feed-left {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
        }

        .feed-badge {
            background-color: var(--danger);
            color: white;
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            font-weight: 800;
            text-transform: uppercase;
        }

        .feed-text {
            color: var(--dark-700);
            font-style: italic;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- NỘI DUNG CHÍNH --- */
        .main-content {
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
            flex: 1;
        }

        /* KPI Banner */
        .kpi-banner {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border-radius: var(--radius-lg);
            padding: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-md);
        }

        .kpi-banner-text h2 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .kpi-banner-text p {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.85);
        }

        .action-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 10px 18px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-dark); }
        .btn-secondary { background-color: rgba(255, 255, 255, 0.15); color: white; border: 1px solid rgba(255, 255, 255, 0.2); }
        .btn-secondary:hover { background-color: rgba(255, 255, 255, 0.25); }
        .btn-success { background-color: var(--success); color: white; }
        .btn-success:hover { background-color: var(--success-dark); }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-outline { background-color: white; color: var(--dark-800); border: 1px solid var(--gray-300); }
        .btn-outline:hover { background-color: var(--gray-100); }

        /* GRID THI ĐUA XUẤT SẮC */
        .ranking-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        @media (min-width: 768px) {
            .ranking-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .rank-card {
            background-color: white;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .rank-card.leader {
            background: linear-gradient(to right, #fffdf5, white);
            border-color: #fef3c7;
        }

        .rank-card.staff {
            background: linear-gradient(to right, #f0fdf4, white);
            border-color: #dcfce7;
        }

        .rank-icon-box {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .rank-card.leader .rank-icon-box { background-color: var(--warning); }
        .rank-card.staff .rank-icon-box { background-color: var(--success); }

        .rank-info h4 {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .rank-card.leader .rank-info h4 { color: var(--warning-dark); }
        .rank-card.staff .rank-info h4 { color: var(--success-dark); }

        .rank-info h3 {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--dark-900);
            margin: 4px 0;
        }

        .rank-info p {
            font-size: 0.8rem;
            color: var(--dark-700);
        }

        /* CARD GIAO DIỆN CHUNG */
        .card {
            background-color: white;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            margin-bottom: 24px;
        }

        .card-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .card-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--dark-900);
        }

        .card-header p {
            font-size: 0.75rem;
            color: var(--gray-400);
            margin-top: 2px;
        }

        /* BẢNG BIỂU HIỂN THỊ DỮ LIỆU SPREADSHEET */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .table th {
            background-color: var(--gray-50);
            padding: 14px 18px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--dark-700);
            border-bottom: 1px solid var(--gray-200);
        }

        .table td {
            padding: 14px 18px;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--gray-100);
            vertical-align: middle;
        }

        .table tr:hover td {
            background-color: rgba(248, 250, 252, 0.8);
        }

        .spreadsheet-table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            border: 1px solid #cbd5e1;
            font-size: 0.85rem;
        }

        .spreadsheet-table th {
            background-color: #f1f5f9;
            color: var(--dark-900);
            font-weight: 700;
            text-transform: uppercase;
            border: 1px solid #cbd5e1;
            padding: 12px 14px;
            text-align: center;
            font-size: 0.75rem;
        }

        .spreadsheet-table td {
            border: 1px solid #e2e8f0;
            padding: 8px;
            vertical-align: middle;
        }

        .spreadsheet-table tr:nth-child(even) td {
            background-color: #f8fafc;
        }

        /* Ô nhập văn bản thông minh tự co dãn và tô màu */
        .spreadsheet-textarea {
            width: 100%;
            border: none;
            background: transparent;
            padding: 6px 8px;
            outline: none;
            font-family: var(--font);
            font-size: 0.85rem;
            resize: none;
            overflow: hidden;
            word-break: break-word;
            white-space: pre-wrap;
            line-height: 1.4;
            min-height: 38px;
            display: block;
            transition: background-color 0.1s;
        }

        .spreadsheet-textarea:focus {
            background-color: #f1f5f9;
            box-shadow: inset 0 0 0 1px var(--primary);
            border-radius: var(--radius-sm);
        }

        .spreadsheet-select {
            width: 100%;
            border: 1px solid #cbd5e1;
            background-color: #f8fafc;
            border-radius: var(--radius-sm);
            padding: 6px 8px;
            font-family: var(--font);
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .image-cell-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .thumb-preview {
            width: 42px;
            height: 42px;
            border-radius: 4px;
            object-fit: cover;
            cursor: pointer;
            border: 1px solid var(--gray-300);
            transition: transform 0.15s;
        }

        .thumb-preview:hover {
            transform: scale(1.1);
        }

        .upload-icon-btn {
            background-color: var(--gray-100);
            border: 1px dashed var(--gray-400);
            border-radius: 4px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upload-icon-btn:hover {
            background-color: var(--primary-light);
            border-color: var(--primary);
        }

        /* Ghi chú co giãn và chọn màu */
        .note-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
        }

        .note-toolbar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px;
            background-color: #f1f5f9;
            border-radius: var(--radius-sm);
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .note-toolbar:hover {
            opacity: 1;
        }

        .color-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid rgba(0, 0, 0, 0.15);
        }

        /* BADGES */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 700;
        }

        .badge-success { background-color: var(--success-light); color: var(--success-dark); }
        .badge-warning { background-color: var(--warning-light); color: var(--warning-dark); }
        .badge-danger { background-color: var(--danger-light); color: var(--danger-dark); }
        .badge-info { background-color: var(--primary-light); color: var(--primary); }
        .badge-purple { background-color: #f5f3ff; color: #6d28d9; }

        /* MODAL GIAO DIỆN CAO CẤP */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 16px;
        }

        .modal-content {
            background-color: white;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 650px;
            max-height: 95vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--gray-400);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close-btn:hover {
            color: var(--danger);
        }

        .modal-body {
            padding: 24px;
        }

        /* BIỂU MẪU ĐĂNG NHẬP */
        .login-card {
            background-color: white;
            padding: 40px;
            border-radius: var(--radius-lg);
            max-width: 450px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            text-align: center;
            border: 1px solid var(--gray-200);
        }

        /* FORM NHẬP LIỆU */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--dark-700);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius-md);
            outline: none;
            font-family: var(--font);
            font-size: 0.85rem;
            transition: border-color 0.2s;
        }

        .form-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        /* TOASTER THÔNG BÁO */
        .notification-toaster {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background-color: var(--dark-900);
            color: white;
            padding: 18px 22px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 14px;
            border-left: 6px solid var(--success);
            max-width: 400px;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideIn {
            from { transform: translateX(120%); }
            to { transform: translateX(0); }
        }

        /* CHỮ KÝ ĐIỆN TỬ CẢM ỨNG */
        .signature-title {
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            color: var(--dark-700);
            margin-bottom: 8px;
        }

        .signature-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 8px;
        }

        @media (max-width: 600px) {
            .signature-grid {
                grid-template-columns: 1fr;
            }
        }

        .signature-box {
            background-color: var(--gray-50);
            border: 1px dashed var(--gray-300);
            border-radius: var(--radius-md);
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .signature-box label {
            font-size: 0.65rem;
            color: var(--gray-500);
            font-weight: 700;
            text-transform: uppercase;
            display: block;
        }

        .sig-canvas-wrapper {
            position: relative;
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: 4px;
            height: 90px;
            width: 100%;
        }

        .sig-canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .clear-sig-btn {
            background: none;
            border: none;
            color: var(--danger-dark);
            font-size: 0.65rem;
            cursor: pointer;
            font-weight: 700;
            align-self: flex-end;
        }

        .clear-sig-btn:hover {
            text-decoration: underline;
        }

        /* --- PHÂN TÍCH ĐIỂM SỐ TIẾN TRÌNH --- */
        .progress-bar-container {
            width: 100%;
            background-color: var(--gray-200);
            border-radius: var(--radius-full);
            height: 8px;
            overflow: hidden;
            margin-top: 6px;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--primary);
            border-radius: var(--radius-full);
            transition: width 0.3s ease;
        }

        .analytics-sub-tab {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--gray-200);
            padding-bottom: 10px;
        }

        .sub-tab-btn {
            background: none;
            border: none;
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            color: var(--dark-700);
            border-radius: var(--radius-sm);
        }

        .sub-tab-btn.active {
            background-color: var(--primary-light);
            color: var(--primary);
        }

        .header-edit-input {
            background-color: rgba(255, 255, 255, 0.9);

        const DrawingSignaturePad = ({ label, canvasId, onSaveSig }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#1e3a8a'; 

                const getCoordinates = (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                    return {
                        x: clientX - rect.left,
                        y: clientY - rect.top
                    };
                };

                const startDrawing = (e) => {
                    setIsDrawing(true);
                    const coords = getCoordinates(e);
                    ctx.beginPath();
                    ctx.moveTo(coords.x, coords.y);
                };

                const stopDrawing = () => {
                    if (isDrawing) {
                        setIsDrawing(false);
                        ctx.beginPath();
                        onSaveSig(canvas.toDataURL());
                    }
                };

                const draw = (e) => {
                    if (!isDrawing) return;
                    const coords = getCoordinates(e);
                    ctx.lineTo(coords.x, coords.y);
                    ctx.stroke();
                };

                canvas.addEventListener('mousedown', startDrawing);
                canvas.addEventListener('mouseup', stopDrawing);
                canvas.addEventListener('mousemove', draw);

                canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    startDrawing(e);
                });
                canvas.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    stopDrawing();
                });
                canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    draw(e);
                });

                return () => {
                    canvas.removeEventListener('mousedown', startDrawing);
                    canvas.removeEventListener('mouseup', stopDrawing);
                    canvas.removeEventListener('mousemove', draw);
                };
            }, [isDrawing]);

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                onSaveSig("");
            };

            return (
                <div className="signature-box">
                    <label>{label}</label>
                    <div className="sig-canvas-wrapper">
                        <canvas ref={canvasRef} width="180" height="90" className="sig-canvas" id={canvasId}></canvas>
                    </div>
                    <button type="button" onClick={clearCanvas} className="clear-sig-btn">Xóa vẽ lại</button>
                </div>
            );
        };

                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.setValueAtTime(1200, ctx.currentTime + 0.1); 
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.5);

            const calculateEmployeeKPI = (empId) => {
                const empTasks = tasks.filter(t => {
                    const list = Array.isArray(t.assignees) ? t.assignees : (t.assignee ? [t.assignee] : []);
                    return list.includes(empId);
                });
                const plannedTasks = empTasks.filter(t => t.type === "Kế hoạch");
                const unplannedTasks = empTasks.filter(t => t.type === "Phát sinh");

                const getPoints = (status) => {
                    if (status === "XONG") return 10;
                    if (status === "ĐANG LÀM") return 5;
                    return 0;
                };

                const avgPlannedPoints = plannedTasks.length > 0 
                    ? (plannedTasks.reduce((sum, t) => sum + getPoints(t.status), 0) / (plannedTasks.length * 10)) * 100 
                    : 100;

                const avgUnplannedPoints = unplannedTasks.length > 0 
                    ? (unplannedTasks.reduce((sum, t) => sum + getPoints(t.status), 0) / (unplannedTasks.length * 10)) * 100 
                    : 100;

                const attitude = attitudes.find(a => a.empId === empId) || { supervisor: 10, attendance: 10, initiative: 10, customerPraise: 10, note: "" };
                const avgAttitudePoints = ((attitude.supervisor + attitude.attendance + attitude.initiative + attitude.customerPraise) / 40) * 100;

                const totalKPI = Math.round((avgPlannedPoints * 0.4) + (avgUnplannedPoints * 0.3) + (avgAttitudePoints * 0.3));

                let classification = "Yếu";
                if (totalKPI >= 99) classification = "Xuất sắc";
                else if (totalKPI >= 95) classification = "Giỏi";
                else if (totalKPI >= 90) classification = "Khá";
                else if (totalKPI >= 70) classification = "Trung bình";

                const maintCount = maintForms.filter(f => f.empId === empId).length;

                return {
                    totalKPI,
                    classification,
                    plannedCount: plannedTasks.length,
                    plannedCompleted: plannedTasks.filter(t => t.status === "XONG").length,
                    unplannedCount: unplannedTasks.length,
                    unplannedCompleted: unplannedTasks.filter(t => t.status === "XONG").length,
                    maintCount,
                    attitude
                };
            };

                const leaders = results.filter(r => r.role === "Trưởng ca" && r.active).sort((a, b) => b.stats.totalKPI - a.stats.totalKPI);
                const normalStaffs = results.filter(r => r.role === "Nhân viên" && r.active).sort((a, b) => b.stats.totalKPI - a.stats.totalKPI);

                return { leaders, normalStaffs };
            };

            const runDeepAnalytics = (departmentFilter = null) => {
                const targets = departmentFilter 
                    ? employees.filter(e => e.dept === departmentFilter && e.active)
                    : employees.filter(e => e.active);

                const targetIds = targets.map(t => t.id);
                const targetTasks = tasks.filter(t => {
                    const list = Array.isArray(t.assignees) ? t.assignees : (t.assignee ? [t.assignee] : []);
                    return list.some(id => targetIds.includes(id));
                });

                const shiftWorkload = {};
                targetTasks.filter(t => t.status === "XONG").forEach(t => {
                    const list = Array.isArray(t.assignees) ? t.assignees : (t.assignee ? [t.assignee] : []);
                    list.forEach(empId => {
                        const key = `${empId}_${t.date}_${t.shift}`;
                        shiftWorkload[key] = (shiftWorkload[key] || 0) + 1;
                    });
                });

                let maxShiftTaskCount = 0;
                let topShiftWorkerId = null;
                let topShiftDetail = "";
                Object.entries(shiftWorkload).forEach(([key, count]) => {
                    if (count > maxShiftTaskCount) {
                        maxShiftTaskCount = count;
                        const [empId, date, shift] = key.split('_');
                        topShiftWorkerId = empId;
                        topShiftDetail = `Ngày ${date}, ca ${shift} (${count} việc)`;
                    }
                });
                const topShiftWorker = targets.find(e => e.id === topShiftWorkerId);

                const monthWorkload = targets.map(emp => {
                    const completed = targetTasks.filter(t => {
                        const list = Array.isArray(t.assignees) ? t.assignees : (t.assignee ? [t.assignee] : []);

                    return { emp, completed };
                }).sort((a, b) => b.completed - a.completed);

                    return { emp, count: handoverCount };

                    return { emp, score: parseFloat(avgAtt) };
                }).sort((a, b) => b.score - a.score);

                // Điền phiếu bảo trì nhiều nhất

                    const count = maintForms.filter(f => f.empId === emp.id).length;
                    return { emp, count };
                }).sort((a, b) => b.count - a.count);

                return {
                    topShiftWorker: topShiftWorker ? { name: topShiftWorker.name, detail: topShiftDetail } : null,
                    monthWorkload,
                    handovers,
                    bestAttitudes,
                    mostMaintForms
                };
            };

                if (selectedTemplate.requireThirdSig && !maintSignatures.otherDeptName) {
                    triggerCustomAlert("Yêu cầu nhập tên người Vận hành bộ phận khác để ký xác nhận!", "Cảnh báo");

                if (!maintSignatures.workerSigData || !maintSignatures.leaderSigData) {
                    triggerCustomAlert("Vui lòng thực hiện vẽ đầy đủ chữ ký điện tử!", "Cảnh báo");
                    return;
                }
                if (selectedTemplate.requireThirdSig && !maintSignatures.otherDeptSigData) {
                    triggerCustomAlert("Vui lòng thực hiện vẽ chữ ký bộ phận Vận hành khác!", "Cảnh báo");
                    return;
                }

                const worker = employees.find(emp => emp.id === maintSignatures.workerId) || { name: "Kỹ sư", dept: "Cơ Điện" };
                const leader = employees.find(emp => emp.id === maintSignatures.leaderId) || { name: "Trưởng ca" };
                const newFormId = `FM${String(maintForms.length + 1).padStart(3, '0')}`;
                
                const formToSave = {
                    id: newFormId,
                    empId: worker.id,
                    empName: worker.name,
                    systemType: selectedTemplate.systemType,
                    date: new Date().toISOString().split('T')[0],
                    shift: "Ca Bảo Trì Kỹ Thuật",
                    isPlanned: "Bảo trì định kỳ",
                    formDataValues: { ...fillFormData },
                    imageUrl: maintFormImage || "https://placehold.co/600x400/2563eb/ffffff?text=Co+Dien+Bao+Tri",
                    sigWorker: worker.name,
                    sigLeader: leader.name,
                    sigOperator: maintSignatures.otherDeptName || "N/A",
                    workerSigData: maintSignatures.workerSigData,
                    leaderSigData: maintSignatures.leaderSigData,
                    otherDeptSigData: maintSignatures.otherDeptSigData,
                    requireThirdSig: selectedTemplate.requireThirdSig
                };

                const updatedMaint = [formToSave, ...maintForms];
                setMaintForms(updatedMaint);
                setSelectedTemplate(null);
                
                triggerAdminPushNotification(worker.name, formToSave.systemType, newFormId);
            };

            const handleFormImageUpload = (file) => {
                if (!file) return;
                const reader = new FileReader();
                reader.onloadend = () => {
                    setMaintFormImage(reader.result);
                };
                reader.readAsDataURL(file);
            };

            const getActiveUserObj = () => {
                return employees.find(e => e.id === currentUser) || { name: "Hệ thống", role: "Nhân viên" };
            };

            const handleUnlockApp = (e) => {
                e.preventDefault();
                if (inputPass === appPassword) {
                    setIsUnlocked(true);
                    setPassError("");

                    setPassError("Mã PIN không chính xác, vui lòng kiểm tra lại!");

            const handleAdminVerifySubmit = (e) => {
                e.preventDefault();

                    setShowAdminVerifyModal(true);

                                    style={{ width: '100%', padding: '12px 16px', borderRadius: 'var(--radius-md)', border: '1px solid var(--gray-300)', fontSize: '0.95rem', outline: 'none', marginBottom: '12px', textAlign: 'center', fontWeight: 'bold' }}

                                <button type="submit" className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '12px', fontSize: '0.95rem' }}>

                                                                        const updated = [...newTemplateFields];
                                                                        updated[idx].label = e.target.value;
                                                                        setNewTemplateFields(updated);
                                                                    }}
                                                                    className="form-input" 
                                                                />
                                                                <textarea 
                                                                    placeholder="Mô tả hướng dẫn thực hiện của dòng..." 
                                                                    value={field.description || ""} 
                                                                    onChange={(e) => {
                                                                        const updated = [...newTemplateFields];
                                                                        updated[idx].description = e.target.value;
                                                                        setNewTemplateFields(updated);
                                                                        e.target.style.height = "auto";
                                                                        e.target.style.height = `${e.target.scrollHeight}px`;
                                                                    }}
                                                                    className="form-input" 
                                                                    rows="2"
                                                                    style={{ fontSize: '0.75rem', fontFamily: 'monospace' }}
                                                                />
                                                            </div>

                                                            <select 
                                                                value={field.type} 
                                                                onChange={(e) => {
                                                                    const updated = [...newTemplateFields];
                                                                    updated[idx].type = e.target.value;
                                                                    setNewTemplateFields(updated);
                                                                }}
                                                                className="form-input" 
                                                                style={{ width: '130px' }}
                                                            >
                                                                <option value="text">Dòng chữ ngắn</option>
                                                                <option value="select">Dropdown thả chọn</option>
                                                            </select>
                                                            <button 
                                                                type="button" 
                                                                onClick={() => handleRemoveTemplateField(idx)} 
                                                                className="btn btn-outline" 
                                                                style={{ padding: '6px' }}
                                                            >
                                                                <Icon name="x" size={12} color="red" />
                                                            </button>
                                                        </div>

                                                        {field.type === "select" && (
                                                            <div style={{ marginLeft: '12px', borderLeft: '2px solid #cbd5e1', paddingLeft: '12px', display: 'flex', flexDirection: 'column', gap: '6px' }}>
                                                                <span style={{ fontSize: '0.7rem', fontWeight: '700', color: 'var(--gray-500)' }}>Cấu hình danh sách lựa chọn:</span>
                                                                {(field.options || []).map((opt, optIdx) => (
                                                                    <div key={optIdx} style={{ display: 'flex', gap: '6px', alignItems: 'center' }}>
                                                                        <span style={{ fontSize: '0.7rem', color: 'var(--gray-400)' }}>•</span>
                                                                        <input 
                                                                            type="text" 
                                                                            className="form-input" 
                                                                            style={{ padding: '4px 8px', fontSize: '0.8rem', width: '200px' }}
                                                                            value={opt} 
                                                                            onChange={e => handleFieldOptionChange(idx, optIdx, e.target.value)} 
                                                                        />
                                                                        <button 
                                                                            type="button" 
                                                                            onClick={() => handleRemoveFieldOption(idx, optIdx)}
                                                                            style={{ background: 'none', border: 'none', color: 'red', cursor: 'pointer' }}
                                                                        >
                                                                            <Icon name="x" size={10} />
                                                                        </button>
                                                                    </div>
                                                                ))}
                                                                <button 
                                                                    type="button" 
                                                                    className="btn btn-outline" 
                                                                    style={{ fontSize: '0.65rem', padding: '3px 8px', alignSelf: 'flex-start' }}
                                                                    onClick={() => handleAddFieldOption(idx)}
                                                                >
                                                                    + Thêm Tùy Chọn
                                                                </button>
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                            <button type="button" onClick={handleAddTemplateField} className="btn btn-outline" style={{ fontSize: '0.75rem', padding: '6px 12px' }}>
                                                ➕ Thêm Hạng Mục Form Mới
                                            </button>
                                        </div>

                                        <button type="submit" className="btn btn-primary" style={{ justifyContent: 'center', marginTop: '12px' }}>
                                            💾 Lưu Mẫu Này
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ==================== ĐIỀN BIỂU MẪU BẢO TRÌ ==================== */}
                    {selectedTemplate && (
                        <div className="modal-overlay">
                            <div className="modal-content" style={{ maxWidth: '640px' }}>
                                <div className="modal-header">
                                    <h3>BẢNG ĐIỀN KIỂM TRÌ: {selectedTemplate.systemType}</h3>
                                    <button onClick={() => setSelectedTemplate(null)} className="modal-close-btn" style={{ background: 'none', border: 'none' }}>
                                        <Icon name="x" size={20} />
                                    </button>
                                </div>
                                <div className="modal-body">
                                    <form onSubmit={handleSaveMaintForm} style={{ display: 'flex', flexDirection: 'column', gap: '14px' }}>
                                        
                                        {selectedTemplate.fields.map(field => (
                                            <div key={field.key} className="form-group" style={{ borderLeft: field.required ? '4px solid var(--primary)' : 'none', paddingLeft: '8px' }}>
                                                <label className="form-label" style={{ fontSize: '0.85rem', fontWeight: '800', marginBottom: '2px' }}>
                                                    *{field.label} {field.required && <span style={{ color: 'red' }}>*</span>}
                                                </label>
                                                {field.description && (
                                                    <div style={{ whiteSpace: 'pre-line', fontSize: '0.75rem', color: 'var(--dark-700)', padding: '6px 8px', backgroundColor: 'var(--gray-100)', borderRadius: '4px', marginBottom: '6px', fontFamily: 'monospace' }}>
                                                        {field.description}
                                                    </div>
                                                )}
                                                
                                                {field.type === "select" ? (
                                                    <select 
                                                        required={field.required}
                                                        className="form-input"
                                                        value={fillFormData[field.key] || ""}
                                                        onChange={(e) => setFillFormData({ ...fillFormData, [field.key]: e.target.value })}
                                                    >
                                                        <option value="" disabled>-- Lựa chọn --</option>
                                                        {(field.options || []).map((opt, oIdx) => (
                                                            <option key={oIdx} value={opt}>{opt}</option>
                                                        ))}
                                                    </select>
                                                ) : (
                                                    <input 
                                                        type="text" 
                                                        required={field.required} 
                                                        className="form-input" 
                                                        value={fillFormData[field.key] || ""} 
                                                        onChange={(e) => setFillFormData({ ...fillFormData, [field.key]: e.target.value })}
                                                    />
                                                )}
                                            </div>
                                        ))}

                                        <div className="form-group" style={{ borderTop: '1px solid var(--gray-200)', paddingTop: '12px' }}>
                                            <label className="form-label" style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                                                <span>📷 HÌNH ẢNH HOÀN THÀNH THỰC TẾ</span>
                                                <span style={{ color: 'red' }}>*</span>
                                            </label>
                                            <input type="file" required accept="image/*" onChange={(e) => handleFormImageUpload(e.target.files[0])} style={{ marginBottom: '8px' }} />
                                            {maintFormImage && (
                                                <img src={maintFormImage} alt="Preview" style={{ width: '100%', height: '180px', objectFit: 'cover', borderRadius: '8px', border: '1px solid var(--gray-300)' }} />
                                            )}
                                        </div>

                                        <div className="signature-section">
                                            <h4 className="signature-title">Ký xác thực điện tử buộc vẽ chữ ký *</h4>
                                            
                                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginBottom: '12px' }}>
                                                <div>
                                                    <label className="form-label" style={{ fontSize: '0.65rem' }}>Chọn tên Kỹ sư bảo trì *</label>
                                                    <select 
                                                        value={maintSignatures.workerId} 
                                                        onChange={e => setMaintSignatures({ ...maintSignatures, workerId: e.target.value })}
                                                        className="form-input"
                                                    >
                                                        {employees.map(emp => (
                                                            <option key={emp.id} value={emp.id}>{emp.name}</option>
                                                        ))}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="form-label" style={{ fontSize: '0.65rem' }}>Chọn tên Trưởng ca duyệt *</label>
                                                    <select 
                                                        value={maintSignatures.leaderId} 
                                                        onChange={e => setMaintSignatures({ ...maintSignatures, leaderId: e.target.value })}
                                                        className="form-input"
                                                    >
                                                        {employees.filter(e => e.role === "Trưởng ca").map(emp => (
                                                            <option key={emp.id} value={emp.id}>{emp.name}</option>
                                                        ))}
                                                    </select>
                                                </div>
                                            </div>

                                            <div style={{ marginBottom: '12px' }}>
                                                <label className="form-label" style={{ fontSize: '0.65rem' }}>
                                                    Tên Vận hành bộ phận khác 
                                                    {selectedTemplate.requireThirdSig ? " (Bắt buộc) *" : " (Không bắt buộc)"}
                                                </label>
                                                <input 
                                                    required={selectedTemplate.requireThirdSig}
                                                    type="text" 
                                                    placeholder="Nhập họ tên đối tác..." 
                                                    value={maintSignatures.otherDeptName}
                                                    onChange={e => setMaintSignatures({ ...maintSignatures, otherDeptName: e.target.value })}
                                                    className="form-input"
                                                />
                                            </div>

                                            <div className="signature-grid">
                                                <DrawingSignaturePad 
                                                    label="Ký tên Kỹ sư bảo trì *" 
                                                    canvasId="canvas_worker"
                                                    onSaveSig={(data) => setMaintSignatures(prev => ({ ...prev, workerSigData: data }))}
                                                />
                                                <DrawingSignaturePad 
                                                    label="Ký tên Trưởng ca trực *" 
                                                    canvasId="canvas_leader"
                                                    onSaveSig={(data) => setMaintSignatures(prev => ({ ...prev, leaderSigData: data }))}
                                                />
                                                <DrawingSignaturePad 
                                                    label={`Vận hành bộ phận khác${selectedTemplate.requireThirdSig ? " *" : " (Tùy chọn)"}`} 
                                                    canvasId="canvas_other"
                                                    onSaveSig={(data) => setMaintSignatures(prev => ({ ...prev, otherDeptSigData: data }))}
                                                />
                                            </div>
                                        </div>

                                        <button type="submit" className="btn btn-primary" style={{ justifyContent: 'center', padding: '12px', marginTop: '10px' }}>
                                            ✔️ Hoàn thành bảo trì (Gửi Real-time cho Admin)
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ==================== MODAL PHÂN LẠI VIỆC TỒN ĐỌNG ==================== */}
                    {showReassignModal && taskToReassign && (
                        <div className="modal-overlay" style={{ zIndex: 1300 }} onClick={(e) => e.stopPropagation()}>
                            <div className="modal-content" style={{ maxWidth: '450px' }}>
                                <div className="modal-header">
                                    <h3>🔄 PHÂN LẠI VIỆC TỒN ĐỌNG</h3>
                                    <button onClick={() => { setShowReassignModal(false); setTaskToReassign(null); }} className="modal-close-btn">
                                        <Icon name="x" size={20} />
                                    </button>
                                </div>
                                <div className="modal-body">
                                    <form onSubmit={handleConfirmReassign} style={{ display: 'flex', flexDirection: 'column', gap: '14px' }}>
                                        <div style={{ backgroundColor: 'var(--primary-light)', padding: '12px', borderRadius: '8px', fontSize: '0.8rem', color: 'var(--primary-dark)', marginBottom: '8px' }}>
                                            <strong>Đầu việc gốc:</strong> "{taskToReassign.title}"
                                        </div>
                                        <div className="form-group">
                                            <label className="form-label">Chọn Ngày Chuyển Tới *</label>
                                            <input 
                                                type="date" 
                                                required
                                                value={reassignDate}
                                                onChange={e => setReassignDate(e.target.value)}
                                                className="form-input"
                                            />
                                        </div>
                                        <div className="form-row-2">
                                            <div className="form-group">
                                                <label className="form-label">Chọn Ca Trực *</label>
                                                <select 
                                                    value={reassignShift}
                                                    onChange={e => setReassignShift(e.target.value)}
                                                    className="form-input"
                                                >
                                                    <option value="Ca A">Ca A</option>
                                                    <option value="Ca B">Ca B</option>
                                                    <option value="Ca C">Ca C</option>
                                                </select>
                                            </div>
                                            <div className="form-group">
                                                <label className="form-label">Chọn Tổ Phân Nhóm *</label>
                                                <select 
                                                    value={reassignGroup}
                                                    onChange={e => setReassignGroup(e.target.value)}
                                                    className="form-input"
                                                >
                                                    <option value="VẬN HÀNH">VẬN HÀNH</option>
                                                    <option value="BẢO TRÌ">BẢO TRÌ</option>
                                                    <option value="CARPENTER">CARPENTER</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div className="form-group">
                                            <label className="form-label">Chọn Người Nhận Việc Mới *</label>
                                            <div style={{ maxHeight: '120px', overflowY: 'auto', border: '1px solid #cbd5e1', borderRadius: 'var(--radius-md)', padding: '8px', backgroundColor: '#f8fafc' }}>
                                                {employees.map(emp => (
                                                    <label key={emp.id} style={{ display: 'flex', alignItems: 'center', gap: '8px', fontSize: '0.8rem', padding: '2px 0', cursor: 'pointer' }}>
                                                        <input 
                                                            type="checkbox"
                                                            checked={reassignAssignees.includes(emp.id)}
                                                            onChange={(e) => {
                                                                if (e.target.checked) {
                                                                    setReassignAssignees([...reassignAssignees, emp.id]);
                                                                } else {
                                                                    setReassignAssignees(reassignAssignees.filter(id => id !== emp.id));
                                                                }
                                                            }}
                                                        />
                                                        {emp.name} ({emp.dept})
                                                    </label>
                                                ))}
                                            </div>
                                        </div>
                                        <button type="submit" className="btn btn-primary" style={{ justifyContent: 'center', padding: '12px', marginTop: '8px' }}>
                                            Xác nhận chuyển ca & phân phối việc
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ==================== XEM VÀ IN PDF CHI TIẾT BÁO CÁO CỦA NHÂN VIÊN ==================== */}
                    {viewingForm && (
                        <div className="modal-overlay">
                            <div className="modal-content" style={{ maxWidth: '580px', backgroundColor: 'white' }}>
                                <div className="modal-header no-print">
                                    <h3>Báo cáo kỹ thuật chi tiết</h3>
                                    <div style={{ display: 'flex', gap: '8px' }}>
                                        <button onClick={() => window.print()} className="btn btn-primary" style={{ padding: '6px 12px', fontSize: '0.75rem' }}>
                                            <Icon name="print" size={14} /> Tải PDF / In ngay
                                        </button>
                                        <button onClick={() => setViewingForm(null)} className="modal-close-btn" style={{ background: 'none', border: 'none' }}>
                                            <Icon name="x" size={20} />
                                        </button>
                                    </div>
                                </div>
                                <div className="modal-body" style={{ padding: '30px' }}>
                                    <div style={{ border: '3px double var(--gray-300)', padding: '24px', display: 'flex', flexDirection: 'column', gap: '16px' }}>
                                        <div style={{ textAlign: 'center' }}>
                                            <span style={{ fontSize: '0.65rem', fontWeight: 'bold', color: 'var(--gray-400)', letterSpacing: '2px', display: 'block' }}>HỆ THỐNG KỸ THUẬT</span>
                                            <h2 style={{ fontSize: '1.4rem', fontWeight: '900', marginTop: '4px', textTransform: 'uppercase' }}>BÁO CÁO BẢO TRÌ</h2>
                                            <h3 style={{ fontSize: '1.1rem', color: 'var(--primary)' }}>{viewingForm.systemType}</h3>
                                            <p style={{ fontSize: '0.7rem', color: 'var(--gray-400)', marginTop: '2px' }}>Mã số: {viewingForm.id} • Ngày: {viewingForm.date}</p>
                                        </div>

                                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', fontSize: '0.8rem', borderBottom: '1px solid var(--gray-200)', paddingBottom: '12px' }}>
                                            <div>Nhân viên phụ trách: <strong>{viewingForm.empName}</strong></div>
                                            <div>Ca thực hiện: <strong>{viewingForm.shift} ({viewingForm.isPlanned})</strong></div>
                                        </div>

                                        <div style={{ fontSize: '0.8rem', display: 'flex', flexDirection: 'column', gap: '8px' }}>
                                            <strong>Dữ liệu chi tiết bảo trì thiết bị:</strong>
                                            {Object.entries(viewingForm.formDataValues).map(([key, value]) => (
                                                <div key={key} style={{ padding: '8px 10px', backgroundColor: 'var(--gray-50)', borderRadius: '4px', border: '1px solid var(--gray-200)' }}>
                                                    <span style={{ color: 'var(--gray-400)', fontSize: '0.7rem', display: 'block', textTransform: 'uppercase' }}>Hạng mục {key}:</span>
                                                    <strong style={{ whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>{value}</strong>
                                                </div>
                                            ))}
                                        </div>

                                        <div style={{ fontSize: '0.75rem' }}>
                                            <strong>Hình ảnh bảo trì thực tế hiện trường:</strong>
                                            <img src={viewingForm.imageUrl} alt="Ảnh bảo trì" style={{ width: '100%', height: '220px', objectFit: 'cover', borderRadius: '8px', marginTop: '6px', border: '1px solid var(--gray-200)' }} />
                                        </div>

                                        <div style={{ borderTop: '1px solid var(--gray-200)', paddingTop: '16px', display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '8px', textAlign: 'center', fontSize: '0.7rem' }}>
                                            <div>
                                                <span style={{ display: 'block', fontWeight: 'bold', color: 'var(--gray-400)', marginBottom: '4px' }}>KỸ SƯ BẢO TRÌ</span>
                                                {viewingForm.workerSigData && (
                                                    <img src={viewingForm.workerSigData} alt="Worker Sig" style={{ width: '100px', height: '50px', objectFit: 'contain', margin: '4px auto' }} />
                                                )}
                                                <strong style={{ display: 'block', fontSize: '0.8rem' }}>{viewingForm.sigWorker}</strong>
                                            </div>
                                            <div>
                                                <span style={{ display: 'block', fontWeight: 'bold', color: 'var(--gray-400)', marginBottom: '4px' }}>TRƯỞNG CA DUYỆT</span>
                                                {viewingForm.leaderSigData && (
                                                    <img src={viewingForm.leaderSigData} alt="Leader Sig" style={{ width: '100px', height: '50px', objectFit: 'contain', margin: '4px auto' }} />
                                                )}
                                                <strong style={{ display: 'block', fontSize: '0.8rem' }}>{viewingForm.sigLeader}</strong>
                                            </div>
                                            <div>
                                                <span style={{ display: 'block', fontWeight: 'bold', color: 'var(--gray-400)', marginBottom: '4px' }}>VẬN HÀNH KHÁC</span>
                                                {viewingForm.requireThirdSig && viewingForm.otherDeptSigData ? (
                                                    <img src={viewingForm.otherDeptSigData} alt="Other Sig" style={{ width: '100px', height: '50px', objectFit: 'contain', margin: '4px auto' }} />
                                                ) : (
                                                    <div style={{ height: '54px', color: '#94a3b8', fontStyle: 'italic', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>Không yêu cầu</div>
                                                )}
                                                <strong style={{ display: 'block', fontSize: '0.8rem' }}>{viewingForm.sigOperator}</strong>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* --- POPUP CẢNH BÁO TÙY BIẾN --- */}
                    {customAlert && (
                        <div className="modal-overlay" style={{ zIndex: 1300 }}>
                            <div className="modal-content" style={{ maxWidth: '380px', padding: '20px', textAlign: 'center' }}>
                                <div style={{ fontSize: '32px', color: 'var(--primary)', marginBottom: '10px' }}>🔔</div>
                                <h3 style={{ fontSize: '1.1rem', fontWeight: 'bold', marginBottom: '8px' }}>{customAlert.title}</h3>
                                <p style={{ fontSize: '0.85rem', color: 'var(--dark-700)', marginBottom: '18px' }}>{customAlert.message}</p>
                                <button onClick={() => setCustomAlert(null)} className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '10px' }}>
                                    Xác nhận
                                </button>
                            </div>
                        </div>
                    )}

                    {/* --- POPUP HỎI Ý KIẾN TÙY BIẾN --- */}
                    {customConfirm && (
                        <div className="modal-overlay" style={{ zIndex: 1300 }}>
                            <div className="modal-content" style={{ maxWidth: '380px', padding: '20px', textAlign: 'center' }}>
                                <div style={{ fontSize: '32px', color: 'var(--danger)', marginBottom: '10px' }}>❓</div>
                                <h3 style={{ fontSize: '1.1rem', fontWeight: 'bold', marginBottom: '12px' }}>XÁC NHẬN HÀNH ĐỘNG</h3>
                                <p style={{ fontSize: '0.85rem', color: 'var(--dark-700)', marginBottom: '20px' }}>{customConfirm.message}</p>
                                <div style={{ display: 'flex', gap: '10px' }}>
                                    <button onClick={() => setCustomConfirm(null)} className="btn btn-outline" style={{ flex: 1, justifyContent: 'center' }}>
                                        Hủy bỏ
                                    </button>
                                    <button onClick={() => {
                                        customConfirm.onConfirm();
                                        setCustomConfirm(null);
                                    }} className="btn btn-danger" style={{ flex: 1, justifyContent: 'center' }}>
                                        Đồng ý
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const exportToCSV = (dataList, filename) => {
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += "Mã NV,Họ Tên,Chức Vụ,KPI Tổng Hợp (%),Phân Loại\n";
            dataList.forEach(row => {
                const stats = calculateEmployeeKPI(row.id);
                csvContent += `"${row.id}","${row.name}","${row.role}","${stats.totalKPI}%","${stats.classification}"\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `${filename}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

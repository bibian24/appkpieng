        function SignaturePad({ title, onSave, onClear, savedImage }) {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#1e3a8a';
            }, [savedImage]);

            const getMousePos = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            };

            const startDrawing = (e) => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const pos = getMousePos(e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                if (e.cancelable) e.preventDefault();
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const pos = getMousePos(e);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            };

            const stopDrawing = () => {
                if (!isDrawing) return;
                setIsDrawing(false);
                const canvas = canvasRef.current;
                onSave(canvas.toDataURL());
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                onClear();
            };

            return (
                <div className="border border-slate-200 rounded-xl p-3 bg-white text-center flex flex-col items-center shadow-sm w-full">
                    <span className="font-bold text-slate-700 block mb-2 uppercase text-[10px] tracking-wider">{title}</span>
                    <div className="w-full h-24 bg-slate-50 border rounded-lg relative overflow-hidden flex items-center justify-center">
                        <canvas
                            ref={canvasRef}
                            width={220}
                            height={96}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                            className="absolute top-0 left-0 w-full h-full cursor-crosshair touch-none"
                        />
                    </div>
                    <button type="button" onClick={clearCanvas} className="text-[10px] text-rose-600 font-bold mt-2 hover:underline">Xóa vẽ lại</button>
                </div>
            );
        }

            const calculateEmployeeStats = (empId) => {
                const empTasks = tasks.filter(t => t.assignees.includes(empId));
                const totalCount = empTasks.length;
                const completed = empTasks.filter(t => t.status === "XONG").length;
                const handover = empTasks.filter(t => t.status === "BÀN GIAO").length;
                const working = empTasks.filter(t => t.status === "ĐANG LÀM").length;
                const remake = empTasks.filter(t => t.status === "LÀM LẠI").length;

                const taskPoints = empTasks.reduce((sum, t) => {
                    if (t.status === "XONG") return sum + 10;
                    if (t.status === "ĐANG LÀM") return sum + 5;
                    if (t.status === "LÀM LẠI") return sum + 2;
                    return sum;
                }, 0);

                const workScore = totalCount > 0 ? (taskPoints / (totalCount * 10)) * 100 : 100;
                const att = attitudes[empId] || { sup: 5, att: 5, init: 5, praise: 5 };
                const attitudeScore = ((att.sup + att.att + att.init + att.praise) / 20) * 100;

                const finalKPI = Math.round((workScore * 0.7) + (attitudeScore * 0.3));

                let rank = "Trung bình";
                if (finalKPI >= 99) rank = "Xuất sắc";
                else if (finalKPI >= 95) rank = "Giỏi";
                else if (finalKPI >= 90) rank = "Khá";
                else if (finalKPI >= 70) rank = "Trung bình";

                return { totalCount, completed, handover, working, remake, finalKPI, rank, att };

                                                    onClick={() => setLogoutOption(opt)} 
                                                    className={`px-3 py-2 rounded-lg font-bold flex-1 transition-all border
                                                    ${logoutOption === opt ? 'bg-slate-900 text-white border-slate-900 shadow-md' : 'bg-white text-slate-600 hover:bg-slate-100 border-slate-200'}`}
                                                >
                                                    {opt === 'Never' ? 'Tắt tự khóa' : opt === '1h' ? '1 giờ' : opt === '30m' ? '30 phút' : '15 phút'}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* NÚT GIẢI PHÓNG BỘ NHỚ LƯU TRỮ LOCALSTORAGE */}
                                    <div className="bg-white rounded-2xl border shadow-sm p-6">
                                        <h3 className="font-extrabold text-slate-800 text-xs uppercase mb-4 border-b pb-2">💾 QUẢN LÝ DUNG LƯỢNG LƯU TRỮ</h3>
                                        <p className="text-[11px] text-slate-500 mb-4 leading-relaxed">Bộ nhớ trình duyệt có giới hạn. Sau khi xuất báo cáo Excel, hãy bấm dọn dẹp để xóa bớt các hình ảnh và chữ ký cũ nhằm giải phóng dung lượng.</p>
                                        <button 
                                            onClick={handleClearStorage}
                                            className="w-full bg-amber-500 hover:bg-amber-600 text-white font-extrabold py-3 rounded-xl shadow-md text-xs transition-all flex items-center justify-center gap-2"
                                        >
                                            🧹 Giải phóng bộ nhớ ứng dụng
                                        </button>
                                    </div>
                                </div>

                            </div>
                        )}

                    </main>

                    {/* HỘP THOẠI CẢNH BÁO/XÁC NHẬN NỘI BỘ (THAY THẾ HOÀN TOÀN ALERT/CONFIRM) */}
                    {customModal.show && (
                        <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 border-t-4 border-blue-600">
                                <h3 className="font-extrabold text-slate-900 text-sm mb-2 uppercase tracking-wider">Thông báo hệ thống</h3>
                                <p className="text-xs text-slate-600 mb-6 leading-relaxed">{customModal.message}</p>
                                <div className="flex justify-end gap-3">
                                    {customModal.isConfirmType && (
                                        <button 
                                            onClick={() => setCustomModal({ show: false, message: "", onConfirm: null, isConfirmType: false })}
                                            className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-lg text-xs"
                                        >
                                            Hủy bỏ
                                        </button>
                                    )}
                                    <button 
                                        onClick={() => {
                                            if (customModal.onConfirm) customModal.onConfirm();
                                            setCustomModal({ show: false, message: "", onConfirm: null, isConfirmType: false });
                                        }}
                                        className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg text-xs shadow-md"
                                    >
                                        Xác nhận
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL CHỌN NGƯỜI LÀM THAY THẾ CHO HOVER (SÁNG TẠO - SIÊU TIỆN DỤNG VỚI THANH TÌM KIẾM & BỘ LỌC) */}
                    {activeAssigneeEditIndex !== null && (() => {
                        const currentTask = tasks[activeAssigneeEditIndex];
                        if (!currentTask) return null;
                        const grouped = getGroupedEmployees();
                        
                        return (
                            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                                <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-lg w-full p-6 max-h-[85vh] flex flex-col">
                                    <div className="flex justify-between items-center border-b pb-3 mb-4">
                                        <div>
                                            <h3 className="font-extrabold text-slate-900 text-sm uppercase">👥 PHÂN CÔNG NHÂN SỰ CHUYÊN NGHIỆP</h3>
                                            <p className="text-[10px] text-slate-500 font-medium mt-0.5">Mã công việc: {currentTask.id}</p>
                                        </div>
                                        <button 
                                            onClick={() => setActiveAssigneeEditIndex(null)}
                                            className="bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold px-3 py-1.5 rounded-lg"
                                        >
                                            Đóng & Lưu
                                        </button>
                                    </div>

                                    {/* THANH TÌM KIẾM NHANH */}
                                    <div className="mb-3 relative">
                                        <input 
                                            type="text"
                                            value={assigneeSearchQuery}
                                            onChange={e => setAssigneeSearchQuery(e.target.value)}
                                            placeholder="🔍 Nhập họ tên hoặc bộ phận cần tìm..."
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 pl-9 text-xs font-semibold text-slate-800 outline-none focus:ring-1 focus:ring-blue-500"
                                        />
                                        <span className="absolute left-3 top-2.5 text-slate-400"></span>
                                    </div>

                                    {/* ĐẾM SỐ LƯỢNG ĐÃ CHỌN */}
                                    <div className="flex justify-between items-center text-[10px] font-bold bg-blue-50 p-2.5 rounded-xl text-blue-900 mb-3">
                                        <span>Đã chọn: <strong className="text-blue-600 text-xs">{currentTask.assignees.length}</strong> nhân sự</span>
                                        <button 
                                            type="button" 
                                            onClick={() => handleUpdateTaskField(activeAssigneeEditIndex, "assignees", [])}
                                            className="text-rose-600 hover:underline"
                                        >
                                            Xóa toàn bộ đã chọn
                                        </button>
                                    </div>

                                    {/* DANH SÁCH CUỘN CHỨA NHÂN SỰ PHÂN NHÓM */}
                                    <div className="flex-1 overflow-y-auto space-y-4 pr-1 custom-scrollbar text-xs">
                                        {Object.entries(grouped).map(([deptName, list]) => {
                                            // Lọc theo từ khóa tìm kiếm
                                            const filteredList = list.filter(emp => 
                                                emp.name.toLowerCase().includes(assigneeSearchQuery.toLowerCase()) ||
                                                emp.dept.toLowerCase().includes(assigneeSearchQuery.toLowerCase())
                                            );

                                            if (filteredList.length === 0) return null;

                                            return (
                                                <div key={deptName} className="border border-slate-100 rounded-xl p-3 bg-slate-50/50">
                                                    <div className="flex justify-between items-center mb-2 pb-1.5 border-b border-slate-200/60">
                                                        <span className="font-extrabold text-slate-700 text-[11px] tracking-wide uppercase">Tổ: {deptName}</span>
                                                        <div className="flex gap-2">
                                                            <button 
                                                                type="button"
                                                                onClick={() => {
                                                                    const groupIds = filteredList.map(e => e.id);
                                                                    const merged = Array.from(new Set([...currentTask.assignees, ...groupIds]));
                                                                    handleUpdateTaskField(activeAssigneeEditIndex, "assignees", merged);
                                                                }}
                                                                className="text-[9px] text-blue-600 hover:underline font-bold"
                                                            >
                                                                + Chọn hết tổ
                                                            </button>
                                                            <button 
                                                                type="button"
                                                                onClick={() => {
                                                                    const groupIds = filteredList.map(e => e.id);
                                                                    const filtered = currentTask.assignees.filter(id => !groupIds.includes(id));
                                                                    handleUpdateTaskField(activeAssigneeEditIndex, "assignees", filtered);
                                                                }}
                                                                className="text-[9px] text-rose-600 hover:underline font-bold"
                                                            >
                                                                - Bỏ hết tổ
                                                            </button>
                                                        </div>
                                                    </div>

                                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                        {filteredList.map(emp => {
                                                            const isChecked = currentTask.assignees.includes(emp.id);
                                                            return (
                                                                <label 
                                                                    key={emp.id} 
                                                                    className={`flex items-center gap-2.5 p-2 rounded-lg border cursor-pointer select-none transition-all
                                                                    ${isChecked 
                                                                        ? 'bg-blue-50 border-blue-200 text-blue-900 font-bold' 
                                                                        : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'}`}
                                                                >
                                                                    <input 
                                                                        type="checkbox"
                                                                        checked={isChecked}
                                                                        onChange={() => {
                                                                            const updatedList = isChecked
                                                                                ? currentTask.assignees.filter(id => id !== emp.id)
                                                                                : [...currentTask.assignees, emp.id];
                                                                            handleUpdateTaskField(activeAssigneeEditIndex, "assignees", updatedList);
                                                                        }}
                                                                        className="rounded border-slate-300 text-blue-600 focus:ring-blue-500 h-4 w-4"
                                                                    />
                                                                    <div className="flex flex-col text-left">
                                                                        <span className="text-[11px] tracking-tight">{emp.name}</span>
                                                                        <span className="text-[9px] text-slate-400 font-semibold">{emp.role}</span>
                                                                    </div>
                                                                </label>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    <div className="mt-4 pt-3 border-t flex gap-2">
                                        <button 
                                            type="button"
                                            onClick={() => setActiveAssigneeEditIndex(null)}
                                            className="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3 rounded-xl shadow-md text-xs tracking-wide uppercase transition-all"
                                        >
                                            Xác nhận và Áp dụng ({currentTask.assignees.length} nhân sự)
                                        </button>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {/* MODAL LIGHTBOX XEM ẢNH MINH CHỨNG SPREADSHEET */}
                    {lightboxImage && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={() => setLightboxImage(null)}>
                            <img src={lightboxImage} alt="lightbox-zoom" className="max-w-[90%] max-h-[90%] rounded-xl shadow-2xl border-4 border-white cursor-pointer" />
                        </div>
                    )}

                    {/* MODAL POP-UP XEM CHI TIẾT PHIẾU BẢO TRÌ & 3 CHỮ KÝ HOÀN CHỈNH */}
                    {viewingForm && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6">
                                <div className="flex justify-between items-center border-b border-slate-200 pb-3 mb-4">
                                    <div>
                                        <span className="text-[10px] text-slate-400 font-bold uppercase">MÃ PHIẾU LƯU TRỮ: {viewingForm.id}</span>
                                        <h3 className="font-extrabold text-slate-900 text-base uppercase mt-0.5">PHIẾU BẢO TRÌ: {viewingForm.templateName}</h3>
                                    </div>
                                    <button onClick={() => setViewingForm(null)} className="bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold px-3 py-1.5 rounded-lg transition-colors">Đóng lại</button>
                                </div>

                                <div className="space-y-4 text-xs animate-fadeIn">
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3 bg-slate-50 p-3 rounded-xl border text-slate-800">
                                        <div><span className="text-slate-400 block font-semibold text-[10px] uppercase">Kỹ sư thực hiện:</span> <strong className="text-[11px]">{viewingForm.engineer}</strong></div>
                                        <div><span className="text-slate-400 block font-semibold text-[10px] uppercase">Giám sát phê duyệt:</span> <strong className="text-[11px]">{viewingForm.supervisor}</strong></div>
                                        <div><span className="text-slate-400 block font-semibold text-[10px] uppercase">Nhân viên vận hành:</span> <strong className="text-[11px]">{viewingForm.operator}</strong></div>
                                    </div>

                                    <div>
                                        <span className="block font-bold text-slate-700 uppercase tracking-wider mb-2">Hạng mục & Chỉ số đo đạc:</span>
                                        <div className="border rounded-xl overflow-hidden text-slate-800">
                                            <table className="w-full text-left">
                                                <thead>
                                                    <tr className="bg-slate-50 border-b text-slate-500 font-bold text-[10px] uppercase"><th className="p-2">Hạng mục kiểm tra</th><th className="p-2 text-center" style={{ width: '35%' }}>Kết quả</th></tr>
                                                </thead>
                                                <tbody>
                                                    {Object.entries(viewingForm.responses).map(([k, v]) => (
                                                        <tr key={k} className="border-b last:border-none hover:bg-slate-50/50">
                                                            <td className="p-2.5 font-medium text-slate-700 capitalize">{k}</td>
                                                            <td className="p-2.5 text-center font-extrabold text-blue-600">{v || "N/A"}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>

                                    {/* HIỂN THỊ DANH SÁCH NHIỀU HÌNH ẢNH MINH CHỨNG TRÊN FORM NỘP */}
                                    {((viewingForm.images && viewingForm.images.length > 0) || viewingForm.image) && (
                                        <div>
                                            <span className="block font-bold text-slate-700 uppercase tracking-wider mb-2">Ảnh minh chứng hiện trường:</span>
                                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                                {(viewingForm.images || [viewingForm.image]).map((img, imgIdx) => (
                                                    <img 
                                                        key={imgIdx} 
                                                        src={img} 
                                                        className="h-24 w-full object-cover rounded-xl border border-slate-300 cursor-zoom-in hover:opacity-90 transition-opacity" 
                                                        onClick={() => setLightboxImage(img)} 
                                                    />
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* Hiển thị 3 chữ ký của phiếu đã lưu */}
                                    <div>
                                        <span className="block font-bold text-slate-700 uppercase tracking-wider mb-3 text-center">Xác thực 3 chữ ký của phiếu nộp</span>
                                        <div className="grid grid-cols-3 gap-3">
                                            <div className="border rounded-xl p-2 bg-slate-50 text-center">
                                                <span className="text-[9px] font-bold text-slate-400 block mb-1 uppercase">Kỹ sư thực hiện</span>
                                                <div className="w-full h-16 bg-white rounded border flex items-center justify-center overflow-hidden">
                                                    {viewingForm.sigEng ? <img src={viewingForm.sigEng} className="max-h-full max-w-full" /> : <span className="text-slate-300 text-[9px]">Không có</span>}
                                                </div>
                                            </div>
                                            <div className="border rounded-xl p-2 bg-slate-50 text-center">
                                                <span className="text-[9px] font-bold text-slate-400 block mb-1 uppercase">Giám sát trực ca</span>
                                                <div className="w-full h-16 bg-white rounded border flex items-center justify-center overflow-hidden">
                                                    {viewingForm.sigSup ? <img src={viewingForm.sigSup} className="max-h-full max-w-full" /> : <span className="text-slate-300 text-[9px]">Không có</span>}
                                                </div>
                                            </div>
                                            <div className="border rounded-xl p-2 bg-slate-50 text-center">
                                                <span className="text-[9px] font-bold text-slate-400 block mb-1 uppercase">Vận hành máy</span>
                                                <div className="w-full h-16 bg-white rounded border flex items-center justify-center overflow-hidden">
                                                    {viewingForm.sigOper ? <img src={viewingForm.sigOper} className="max-h-full max-w-full" /> : <span className="text-slate-300 text-[9px]">Không có</span>}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

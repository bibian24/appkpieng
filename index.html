            },
            {

                assignees: ["EMP18", "EMP19"],

        // Mẫu form ban đầu có thêm mục Folder Hệ Thống & Tùy chọn tick tùy biến
        const initialFormTemplates = [
            { 
                id: "FT001",

                fields: [
                    { id: "F-1", label: "KẾ HOẠCH BẢO TRÌ", options: "Đạt,Không Đạt,Cần Theo Dõi", required: true, placeholder: "Nhập kế hoạch..." },
                    { id: "F-2", label: "THỰC HIỆN LOTO (Khóa nguồn và dán cảnh báo an toàn)", options: "Đã Khóa LOTO,Chưa Khóa LOTO", required: true, placeholder: "Ghi nhận kết quả thực hiện..." },
                    { id: "F-3", label: "KHÓA VAN CÂN BẰNG - XẢ NƯỚC THÁP BẢO TRÌ", options: "Hoàn Thành,Chưa Làm,Không Áp Dụng", required: true, placeholder: "Mức nước xả, tình trạng van..." },
                    { id: "F-4", label: "PHẦN ĐIỆN ĐIỀU KHIỂN (Siết cos, vệ sinh biến tần & CB tủ điện)", options: "Tốt,Bình Thường,Lỗi", required: true, placeholder: "Thông số đo đạc, độ siết chặt..." }

                name: "MÁY PHÁT ĐIỆN",

                fields: [

                    { id: "F-2-2", label: "KIỂM TRA MỨC DẦU NHIÊN LIỆU VÀ NƯỚC LÀM MÁT", options: "Đầy Đủ,Cần Bổ Sung", required: true, placeholder: "Báo cáo dung tích thực tế..." }
                ]
            }
        ];

        const initialAttitudes = {
            "EMP01": { sup: 5, att: 5, init: 4, praise: 5, note: "Thái độ tích cực, hoàn thành tốt vai trò giám sát ca." },
            "EMP02": { sup: 4, att: 5, init: 5, praise: 4, note: "Tay nghề kỹ thuật cao, nhiệt tình hỗ trợ đồng đội." },
            "EMP18": { sup: 5, att: 5, init: 5, praise: 5, note: "Hành vi chuẩn mực, tác phong Carpenter xuất sắc." }
        };

        const weekRanges = {
            "2026-W23": { start: "2026-06-01", end: "2026-06-07", label: "Tuần 01 (01/06 - 07/06/2026)" },
            "2026-W24": { start: "2026-06-08", end: "2026-06-14", label: "Tuần 02 (08/06 - 14/06/2026)" },
            "2026-W25": { start: "2026-06-15", end: "2026-06-21", label: "Tuần 03 (15/06 - 21/06/2026)" },
            "2026-W26": { start: "2026-06-22", end: "2026-06-28", label: "Tuần 04 (22/06 - 28/06/2026)" }
        };

        function App() {
            // Safe JSON parser wrapper to prevent blank screens on corrupted local data
            const getSafeLocalStorage = (key, fallback) => {
                try {
                    const data = localStorage.getItem(key);
                    return data ? JSON.parse(data) : fallback;
                } catch (e) {
                    console.error("Lỗi phân tích dữ liệu localStorage cho khóa: " + key, e);
                    return fallback;
                }
            };

            const [loggedInUser, setLoggedInUser] = useState(() => getSafeLocalStorage("kpi_login_v8", null));
            const [employees, setEmployees] = useState(() => getSafeLocalStorage("kpi_emp_v8", initialEmployees));
            const [tasks, setTasks] = useState(() => getSafeLocalStorage("kpi_tasks_v8", initialTasks));
            const [formTemplates, setFormTemplates] = useState(() => getSafeLocalStorage("kpi_templates_v8", initialFormTemplates));
            const [attitudes, setAttitudes] = useState(() => getSafeLocalStorage("kpi_attitudes_v8", initialAttitudes));
            const [submittedForms, setSubmittedForms] = useState(() => getSafeLocalStorage("kpi_submitted_v8", []));
            const [dailyAttitudes, setDailyAttitudes] = useState(() => getSafeLocalStorage("kpi_daily_attitudes_v8", {}));

            const [appConfigs, setAppConfigs] = useState(() => getSafeLocalStorage("kpi_configs_v8", {
                isPaused: false,
                showKpiToUser: true,
                showFormsToUser: true,
                logoutTime: "Never"
            }));

            const [activeTab, setActiveTab] = useState("weekly-plan");
            const [selectedWeek, setSelectedWeek] = useState("2026-W23"); // Tuần 1 tháng 6/2026
            const [selectedDateFilter, setSelectedDateFilter] = useState(""); // Lọc theo ngày
            const [selectedFolder, setSelectedFolder] = useState("HỆ ĐIỆN"); // Thư mục mặc định
            const [toasts, setToasts] = useState([]);
            const [messages, setMessages] = useState([{ id: 1, text: "Hệ thống quản lý KPI Cơ Điện v6 sẵn sàng hoạt động.", time: "12:00" }]);
            
            // Modals & temporary views
            const [confirmState, setConfirmState] = useState({ isOpen: false, title: "", message: "", onConfirm: null });
            const [activeFormTemplate, setActiveFormTemplate] = useState(null);
            const [lightboxImage, setLightboxImage] = useState(null);
            const [viewingForm, setViewingForm] = useState(null);
            const [detailedEmployee, setDetailedEmployee] = useState(null); // Xem chi tiết & thái độ hàng ngày
            const [individualReportEmployee, setIndividualReportEmployee] = useState(null); // Hỗ trợ xem / in PDF cá nhân

            // Form Builder states
            const [newFormName, setNewFormName] = useState("");
            const [newFormFolder, setNewFormFolder] = useState("HỆ ĐIỆN");
            const [editingTemplate, setEditingTemplate] = useState(null);

            // Login inputs
            const [inputUsername, setInputUsername] = useState("");
            const [inputPassword, setInputPassword] = useState("");

            // Time auto-logout counter
            const [secondsLeft, setSecondsLeft] = useState(1800);

            // Shift colors state
            const [shiftColors, setShiftColors] = useState({
                "Ca A": "#f0fdf4", 
                "Ca B": "#fffbeb", 
                "Ca C": "#eff6ff", 
                "Ca N": "#fafafa"  
            });

            // Form fill state
            const [formResponses, setFormResponses] = useState({});
            const [formChecks, setFormChecks] = useState({}); 
            const [formImages, setFormImages] = useState([]);
            const [signedEng, setSignedEng] = useState("");
            const [signedSup, setSignedSup] = useState("");
            const [signedOper, setSignedOper] = useState("");
            const [opNameInput, setOpNameInput] = useState("");
            const [checkedEngineers, setCheckedEngineers] = useState([]);
            const [checkedSupervisors, setCheckedSupervisors] = useState([]);

            // State chấm thái độ hàng ngày nhanh trong modal
            const [dailyAttitudeDate, setDailyAttitudeDate] = useState("2026-06-01");
            const [dailyAttitudeScore, setDailyAttitudeScore] = useState(5);
            const [dailyAttitudeNote, setDailyAttitudeNote] = useState("");

            useEffect(() => {
                localStorage.setItem("kpi_emp_v8", JSON.stringify(employees));
                localStorage.setItem("kpi_tasks_v8", JSON.stringify(tasks));
                localStorage.setItem("kpi_templates_v8", JSON.stringify(formTemplates));
                localStorage.setItem("kpi_attitudes_v8", JSON.stringify(attitudes));
                localStorage.setItem("kpi_submitted_v8", JSON.stringify(submittedForms));
                localStorage.setItem("kpi_configs_v8", JSON.stringify(appConfigs));
                localStorage.setItem("kpi_daily_attitudes_v8", JSON.stringify(dailyAttitudes));
                if (loggedInUser) {
                    localStorage.setItem("kpi_login_v8", JSON.stringify(loggedInUser));
                } else {
                    localStorage.removeItem("kpi_login_v8");
                }
            }, [employees, tasks, formTemplates, attitudes, submittedForms, appConfigs, loggedInUser, dailyAttitudes]);

            useEffect(() => {
                if (appConfigs.logoutTime === "Never" || !loggedInUser) return;
                let minutes = appConfigs.logoutTime === "30m" ? 30 : 60;
                setSecondsLeft(minutes * 60);

                const interval = setInterval(() => {
                    setSecondsLeft(prev => {
                        if (prev <= 1) {
                            setLoggedInUser(null);
                            showToast("Hệ thống tự động đăng xuất để bảo mật thông tin!");
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);

                const resetTimer = () => {
                    let mins = appConfigs.logoutTime === "30m" ? 30 : 60;
                    setSecondsLeft(mins * 60);
                };
                window.addEventListener("click", resetTimer);
                window.addEventListener("keydown", resetTimer);

                return () => {
                    clearInterval(interval);
                    window.removeEventListener("click", resetTimer);
                    window.removeEventListener("keydown", resetTimer);
                };
            }, [appConfigs.logoutTime, loggedInUser]);

            const showToast = (text) => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, text }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, 4000);
            };

            const removeToast = (id) => {
                setToasts(prev => prev.filter(t => t.id !== id));
            };

            const triggerConfirm = (title, message, callback) => {
                setConfirmState({
                    isOpen: true,
                    title,
                    message,
                    onConfirm: () => {
                        callback();
                        setConfirmState({ isOpen: false, title: "", message: "", onConfirm: null });
                    }
                });
            };

            const addAdminLog = (text, formId = null) => {
                const now = new Date();
                const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                setMessages(prev => [{ id: Date.now(), text, time: timeStr, formId }, ...prev]);
            };

            const handleLoginSubmit = (e) => {
                e.preventDefault();
                const user = employees.find(emp => emp.id === inputUsername && emp.password === inputPassword);
                if (user) {
                    setLoggedInUser(user);
                    addAdminLog(`Nhân viên ${user.name} (${user.role}) đăng nhập thành công.`);
                    showToast(`Xin chào ${user.name}!`);
                    setActiveTab("weekly-plan");
                } else {
                    showToast("Mã nhân viên hoặc mật khẩu sai!");
                }
            };

            const handleCreateNextWeekTasks = () => {
                const currentWeekData = weekRanges[selectedWeek];
                const weekKeys = Object.keys(weekRanges);
                const currentIndex = weekKeys.indexOf(selectedWeek);
                
                if (currentIndex === -1 || currentIndex === weekKeys.length - 1) {
                    showToast("Không tìm thấy tuần tiếp theo trong hệ thống để tạo!");
                    return;
                }

                const nextWeekKey = weekKeys[currentIndex + 1];
                const nextWeekData = weekRanges[nextWeekKey];

                triggerConfirm(
                    "Xác nhận tạo việc tuần kế tiếp?",
                    `Hệ thống sẽ sao chép cấu trúc ca trực của tuần đang lọc sang ${nextWeekData.label}. Tiến hành?`,
                    () => {
                        const currentTasks = tasks.filter(t => t.date >= currentWeekData.start && t.date <= currentWeekData.end);
                        if (currentTasks.length === 0) {
                            showToast("Tuần hiện tại chưa có dữ liệu công việc để làm mẫu sao chép!");
                            return;
                        }

                        const newTasksToInsert = currentTasks.map(t => {
                            const originalDateObj = new Date(t.date);
                            const nextDateObj = new Date(originalDateObj.getTime() + 7 * 24 * 60 * 60 * 1000);
                            const nextDateStr = nextDateObj.toISOString().split('T')[0];

                            return {
                                ...t,
                                id: `T-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`,
                                date: nextDateStr,
                                status: "đang thực hiện", 
                                note: "",
                                images: []
                            };
                        });

                        setTasks(prev => [...prev, ...newTasksToInsert]);
                        setSelectedWeek(nextWeekKey);
                        showToast(`Đã nhân bản thành công ca trực sang ${nextWeekData.label}!`);
                    }
                );
            };

            // Thêm dòng mới ngay bên dưới dòng hiện tại (Hỗ trợ biểu tượng thêm mới tại Cột Xóa theo yêu cầu ảnh_6.png)
            const handleInsertTaskRowBelow = (indexInFiltered, originalTaskId) => {
                const originalTask = tasks.find(t => t.id === originalTaskId);
                if (!originalTask) return;

                const newTask = {
                    id: `T-${Date.now()}`,
                    date: originalTask.date, 
                    shift: originalTask.shift,
                    group: originalTask.group,
                    area: "Khu vực mới",
                    title: "Gõ nội dung công việc mới...",
                    assignees: [...originalTask.assignees],
                    status: "đang thực hiện",
                    note: "",
                    noteColor: "#1e293b",
                    noteSize: "text-xs",
                    formLink: "",
                    images: []
                };

                const targetIndex = tasks.findIndex(t => t.id === originalTaskId);
                const updatedTasks = [...tasks];
                updatedTasks.splice(targetIndex + 1, 0, newTask);

                setTasks(updatedTasks);
                showToast("Đã chèn thêm dòng mới ngay dưới vị trí đã chọn!");
            };

            const handleDeleteTaskRow = (taskId) => {
                triggerConfirm(
                    "Xác nhận xóa công việc?",
                    "Bạn có chắc muốn xóa vĩnh viễn công việc này khỏi hệ thống?",
                    () => {
                        setTasks(prev => prev.filter(t => t.id !== taskId));
                        showToast("Đã xóa công việc thành công.");
                    }
                );
            };

            const handleUpdateTask = (id, field, value) => {
                setTasks(prev => prev.map(t => t.id === id ? { ...t, [field]: value } : t));
            };

            const handleSaveFormTemplate = () => {
                if (!newFormName.trim()) {
                    showToast("Vui lòng nhập tên biểu mẫu!");
                    return;
                }
                const isExisting = formTemplates.some(t => t.name === newFormName.toUpperCase() && t.id !== editingTemplate?.id);
                if (isExisting) {
                    showToast("Tên biểu mẫu đã tồn tại!");
                    return;
                }

                if (editingTemplate) {
                    setFormTemplates(prev => prev.map(t => t.id === editingTemplate.id ? { ...t, name: newFormName.toUpperCase(), folder: newFormFolder } : t));
                    showToast("Đã cập nhật biểu mẫu!");
                    setEditingTemplate(null);
                } else {
                    const newTemplate = {
                        id: `FT-${Date.now()}`,
                        name: newFormName.toUpperCase(),
                        folder: newFormFolder,
                        fields: [
                            { id: `F-${Date.now()}-1`, label: "KẾ HOẠCH HOẠT ĐỘNG", options: "Đạt,Không Đạt,Cần Kiểm Tra Lại", required: true, placeholder: "Nhập kế hoạch..." },
                            { id: `F-${Date.now()}-2`, label: "TIẾN ĐỘ THỰC HIỆN BƯỚC 1", options: "Đạt,Không Đạt", required: true, placeholder: "Ghi nhận tiến độ..." }
                        ]
                    };
                    setFormTemplates(prev => [...prev, newTemplate]);
                    showToast("Đã thiết lập mẫu biểu bảo trì mới!");
                }
                setNewFormName("");
            };

            const handleDeleteFormTemplate = (templateId) => {
                triggerConfirm(
                    "Xóa mẫu biểu?",
                    "Mẫu biểu này sẽ bị xóa hoàn toàn và không thể khôi phục lại.",
                    () => {
                        setFormTemplates(prev => prev.filter(t => t.id !== templateId));
                        showToast("Đã xóa mẫu biểu bảo trì.");
                    }
                );
            };

            const handleAddFieldToTemplate = (templateId) => {
                const label = prompt("Nhập tiêu đề hạng mục kiểm tra cần thay đổi/bổ sung:");
                if (!label) return;
                const options = prompt("Nhập các tùy chọn lựa chọn (phân tách bằng dấu phẩy):", "Đạt,Không Đạt,Cần Theo Dõi");
                if (options === null) return;
                
                const newField = {
                    id: `F-${Date.now()}`,
                    label,
                    options: options || "Đạt,Không Đạt",
                    required: true,
                    placeholder: "Nhập kết quả kiểm tra..."
                };

                setFormTemplates(prev => prev.map(t => {
                    if (t.id === templateId) {
                        return { ...t, fields: [...t.fields, newField] };
                    }
                    return t;
                }));
                showToast("Đã thêm hạng mục mới vào mẫu!");
            };

            const handleDeleteFieldFromTemplate = (templateId, fieldId) => {

            const getEmployeeKPI = (empId) => {
                const att = attitudes[empId] || { sup: 5, att: 5, init: 5, praise: 5, note: "" };
                const totalAttitude = (att.sup || 0) + (att.att || 0) + (att.init || 0) + (att.praise || 0);

                const empTasks = tasks.filter(t => t && t.assignees && t.assignees.includes(empId));
                
                if (empTasks.length === 0) {
                    return { 
                        completion: 100, 
                        rank: "Xuất sắc", 
                        total: 0, 
                        attitude: totalAttitude, 
                        rawAttitude: att 
                    };
                }

                let totalWeight = 0;
                let earnedWeight = 0;

                empTasks.forEach(t => {
                    totalWeight += 100;
                    if (t.status === "hoàn thành") earnedWeight += 100;
                    else if (t.status === "đang thực hiện") earnedWeight += 50;
                    else if (t.status === "làm lại") earnedWeight += 20;
                    else if (t.status === "bàn giao") earnedWeight += 0;
                });

                const completionRate = Math.round((earnedWeight / totalWeight) * 100);
                
                // Rank
                let rank = "Trung bình";
                if (completionRate >= 99) rank = "Xuất sắc";
                else if (completionRate >= 95) rank = "Giỏi";
                else if (completionRate >= 90) rank = "Khá";
                else if (completionRate >= 70) rank = "Trung bình";
                else rank = "Cần cải thiện";

                return { 
                    completion: completionRate, 
                    rank, 
                    total: totalWeight / 100, 
                    attitude: totalAttitude, 
                    rawAttitude: att 
                };
            };

                const groupEmployees = employees.filter(e => roleKeys.includes(e.role) && e.id !== "ADMIN" && e.active);

                let bestEmp = null;
                let maxCombinedScore = -1;

                groupEmployees.forEach(emp => {
                    const kpi = getEmployeeKPI(emp.id);
                    const attPercentage = ((kpi.attitude || 0) / 20) * 100;
                    const combined = ((kpi.completion || 0) * 0.7) + (attPercentage * 0.3);

                    if (combined > maxCombinedScore) {
                        maxCombinedScore = combined;
                        bestEmp = {
                            name: emp.name,
                            role: emp.role,
                            combinedScore: Math.round(combined),
                            kpiCompletion: kpi.completion,
                            attitudeScore: kpi.attitude
                        };
                    }
                });

        function SignaturePad({ title, onSave, onClear, savedImage }) {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#1e3a8a'; 
            }, [savedImage]);

            const getMousePos = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            };

            const startDrawing = (e) => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const pos = getMousePos(e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                if (e.cancelable) e.preventDefault();
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const pos = getMousePos(e);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            };

            const stopDrawing = () => {
                if (!isDrawing) return;
                setIsDrawing(false);
                const canvas = canvasRef.current;
                onSave(canvas.toDataURL());
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                onClear();
            };

            return (
                <div className="border border-slate-200 rounded-xl p-3 bg-white text-center flex flex-col items-center shadow-sm">
                    <span className="font-bold text-slate-700 block mb-2 uppercase text-[10px] tracking-wider">{title}</span>
                    <div className="w-full max-w-[200px] h-24 bg-slate-50 border rounded-lg relative overflow-hidden flex items-center justify-center">
                        <canvas
                            ref={canvasRef}
                            width={200}
                            height={96}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                            className="absolute top-0 left-0 w-full h-full cursor-crosshair touch-none"
                        />
                    </div>
                    <button type="button" onClick={clearCanvas} className="text-[10px] text-rose-600 font-bold mt-2 hover:underline transition">Xóa vẽ lại</button>
                </div>
            );
        }

                        <div className="flex gap-2 justify-center">
                            <button onClick={onCancel} className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-4 py-2 rounded-lg transition">Hủy</button>
                            <button onClick={onConfirm} className="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2 rounded-lg transition">Xác nhận</button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

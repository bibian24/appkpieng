<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KPI & TASK MANAGER PRO v6 - ĐỒNG BỘ REALTIME</title>
    
    <!-- React 18 & Babel Compiler -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SheetJS (Xuất Excel) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- Recharts (Biểu đồ) & Thư viện phụ thuộc (Giải quyết triệt để lỗi crash màn hình trắng) -->
    <script src="https://unpkg.com/react-is@18.2.0/umd/react-is.production.min.js"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.10.4/umd/Recharts.js"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- FIREBASE COMPAT SDKs (Hỗ trợ chạy trực tiếp dạng file cục bộ trên máy tính - file://) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @keyframes scaleUp {
            from { transform: scale(0.97); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .animate-scaleUp { animation: scaleUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @media print {
            .no-print { display: none !important; }
            .print-page {
                width: 100% !important; margin: 0 !important; padding: 1cm !important;
                background: white !important; box-shadow: none !important; color: #000 !important;
            }
        }
    </style>
</head>
<body>

    <div id="root">
        <div class="min-h-screen bg-slate-900 flex flex-col items-center justify-center p-4 text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-blue-500 mb-4"></div>
            <p class="text-white text-sm font-bold uppercase tracking-widest">Đang khởi tạo hệ thống v6...</p>
            <p class="text-slate-400 text-[10px] mt-2 max-w-xs">Đang tải và liên kết cơ sở dữ liệu thời gian thực. Vui lòng đợi trong giây lát.</p>
        </div>
    </div>

    <!-- MAIN REACT APP -->
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // CẤU HÌNH THƯ MỤC BIỂU MẪU BẢO TRÌ
        const predefinedFolders = ["HỆ ĐIỆN", "HỆ LẠNH", "HỆ THIẾT BỊ BẾP", "HỆ NƯỚC", "HỆ STP", "HỆ QUẠT", "HỆ PCCC", "HỆ BMS", "HỆ AV", "HẠ TẦNG", "HỆ GA", "HỒ BƠI"];
        
        // DANH SÁCH NHÂN SỰ BAN ĐẦU (TỰ ĐỘNG ĐỒNG BỘ LÊN FIRESTORE)
        const initialEmployees = [
            { id: "ADMIN", name: "Quản Trị Viên", dept: "Ban Quản Trị", role: "Admin", password: "admin", active: true },
            { id: "EMP01", name: "Tạ Đức Long", dept: "Cơ Điện", role: "Duty Engineer", password: "123", active: true },
            { id: "EMP02", name: "Võ Tấn Đạt", dept: "Cơ Điện", role: "Duty Engineer", password: "123", active: true },
            { id: "EMP03", name: "Nguyễn Anh Duy", dept: "Cơ Điện", role: "Duty Engineer", password: "123", active: true },
            { id: "EMP04", name: "Lê Thiết Quý", dept: "Vận Hành", role: "Duty Manager", password: "123", active: true },
            { id: "EMP05", name: "Trần Văn Khánh", dept: "Cơ Điện", role: "Technician", password: "123", active: true },
            { id: "EMP06", name: "Nguyễn Văn Tuấn", dept: "Cơ Điện", role: "Senior Technician", password: "123", active: true },
            { id: "EMP07", name: "Lê Thế Anh", dept: "Carpenter", role: "Carpenter", password: "123", active: true }
        ];

        const initialFormTemplates = [
            { 
                id: "FT001", name: "KIỂM TRA COOLING TOWER", folder: "HỆ LẠNH",
                fields: [
                    { id: "F1", label: "Vệ sinh bồn nước", options: "Đã làm,Chưa làm,Không cần", required: true },
                    { id: "F2", label: "Chỉ số hóa chất PH", options: "Đạt,Không Đạt", required: true },
                ]
            }
        ];

        // Khởi tạo Firestore nếu dữ liệu trống
        const seedFirestore = async (db, appId) => {
            console.log("Đang thiết lập dữ liệu nền ban đầu lên Firestore...");
            const rootRef = db.collection('artifacts').doc(appId).collection('public').doc('data');
            
            for (const emp of initialEmployees) {
                await rootRef.collection('employees').doc(emp.id).set(emp);
            }
            for (const tpl of initialFormTemplates) {
                await rootRef.collection('formTemplates').doc(tpl.id).set(tpl);
            }
            await rootRef.collection('systemConfigs').doc('global').set({
                isPaused: false, 
                showKpiToUser: false, 
                showFormsToUser: false, 
                logoutTime: "Never",
                shiftColors: { "Ca A": "#f0fdf4", "Ca B": "#fffbeb", "Ca C": "#eff6ff", "Ca N": "#fafafa" },
                weekRanges: {
                    "2026-W23": { start: "2026-06-01", end: "2026-06-07", label: "Tuần 01 (01/06 - 07/06/2026)" },
                    "2026-W24": { start: "2026-06-08", end: "2026-06-14", label: "Tuần 02 (08/06 - 14/06/2026)" },
                }
            });
            await rootRef.collection('messages').doc(String(Date.now())).set({
                id: Date.now(), 
                text: "Hệ thống v6 đã cấu hình và kết nối đồng bộ thành công.", 
                time: new Date().toLocaleTimeString(), 
                formId: null
            });
        };

        function App() {
            const [sdkReady, setSdkReady] = useState(false);
            const [user, setUser] = useState(null);
            
            const [employees, setEmployees] = useState([]);
            const [tasks, setTasks] = useState([]);
            const [formTemplates, setFormTemplates] = useState([]);
            const [attitudes, setAttitudes] = useState({});
            const [submittedForms, setSubmittedForms] = useState([]);
            const [messages, setMessages] = useState([]);
            const [appConfigs, setAppConfigs] = useState({ 
                isPaused: false, showKpiToUser: false, showFormsToUser: false, logoutTime: "Never", 
                shiftColors: { "Ca A": "#f0fdf4", "Ca B": "#fffbeb", "Ca C": "#eff6ff", "Ca N": "#fafafa" }, 
                weekRanges: { "2026-W23": { start: "2026-06-01", end: "2026-06-07", label: "Tuần Mặc Định" } } 
            });

            const [loggedInUser, setLoggedInUser] = useState(null);
            const [activeTab, setActiveTab] = useState("weekly-plan");
            
            const [selectedWeek, setSelectedWeek] = useState("");
            const [selectedDate, setSelectedDate] = useState("");
            const [searchFormInput, setSearchFormInput] = useState("");
            const [selectedFolder, setSelectedFolder] = useState("HỆ ĐIỆN");
            
            const [toasts, setToasts] = useState([]);
            const [confirmState, setConfirmState] = useState({ isOpen: false });
            const [secondsLeft, setSecondsLeft] = useState(1800);
            const [lightboxImage, setLightboxImage] = useState(null);

            // Các trạng thái khi điền biểu mẫu bảo trì
            const [activeFormTemplate, setActiveFormTemplate] = useState(null);
            const [formResponses, setFormResponses] = useState({});
            const [formChecks, setFormChecks] = useState({});
            const [formImages, setFormImages] = useState([]);
            const [signedEng, setSignedEng] = useState("");
            const [signedSup, setSignedSup] = useState("");
            const [signedOper, setSignedOper] = useState("");
            const [opNameInput, setOpNameInput] = useState("");
            const [checkedEngineers, setCheckedEngineers] = useState([]);
            const [checkedSupervisors, setCheckedSupervisors] = useState([]);
            const [viewingForm, setViewingForm] = useState(null);

            // Trạng thái Popup phân lại ca từ bảng Tồn đọng
            const [reassignTask, setReassignTask] = useState(null);
            const [reassignDate, setReassignDate] = useState("");
            const [reassignShift, setReassignShift] = useState("Ca A");
            const [reassignGroup, setReassignGroup] = useState("Vận hành");
            const [reassignAssignees, setReassignAssignees] = useState([]);

            // Xác định trạng thái nạp SDK
            useEffect(() => {
                if (window.firebase) setSdkReady(true);
            }, []);

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'kpi-task-manager-pro-v6';
            const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

            // Đăng nhập bảo mật đa tầng thời gian thực
            useEffect(() => {
                if (!sdkReady) return;
                
                const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
                    apiKey: "AIzaSyAs-FakeKeyForLocalExecutionOnly",
                    authDomain: "kpi-task-manager-pro-v6.firebaseapp.com",
                    projectId: "kpi-task-manager-pro-v6",
                    storageBucket: "kpi-task-manager-pro-v6.appspot.com",
                    messagingSenderId: "1234567890",
                    appId: "1:1234:web:abcd"
                };

                let app = firebase.apps.length === 0 ? firebase.initializeApp(firebaseConfig) : firebase.app();
                const auth = firebase.auth();
                
                const initAuth = async () => {
                    try {
                        if (initialToken) await auth.signInWithCustomToken(initialToken);
                        else await auth.signInAnonymously();
                    } catch (e) {
                        await auth.signInAnonymously().catch(console.error);
                    }
                };
                initAuth();
                return auth.onAuthStateChanged(setUser);
            }, [sdkReady]);

            // Đồng bộ dữ liệu trực tiếp từ Firestore (Tuân thủ luật 1 & 2 & 3)
            useEffect(() => {
                if (!user || !sdkReady) return;
                const db = firebase.firestore();
                const rootRef = db.collection('artifacts').doc(appId).collection('public').doc('data');

                const initData = async () => {
                    const snap = await rootRef.collection('employees').get();
                    if (snap.empty) {
                        await seedFirestore(db, appId);
                    }

                    // Tải dữ liệu nhân sự
                    rootRef.collection('employees').onSnapshot(s => {
                        let arr = []; s.forEach(d => arr.push(d.data()));
                        setEmployees(arr.sort((a,b)=>a.id.localeCompare(b.id)));
                    }, (err) => console.error(err));
                    
                    // Tải danh sách công việc
                    rootRef.collection('tasks').onSnapshot(s => {
                        let arr = []; s.forEach(d => arr.push(d.data()));
                        setTasks(arr);
                    }, (err) => console.error(err));
                    
                    // Tải mẫu biểu bảo trì
                    rootRef.collection('formTemplates').onSnapshot(s => {
                        let arr = []; s.forEach(d => arr.push(d.data()));
                        setFormTemplates(arr);
                    }, (err) => console.error(err));
                    
                    // Tải điểm thái độ nhân viên
                    rootRef.collection('attitudes').onSnapshot(s => {
                        let obj = {}; s.forEach(d => obj[d.id] = d.data());
                        setAttitudes(obj);
                    }, (err) => console.error(err));
                    
                    // Tải biểu mẫu đã nộp
                    rootRef.collection('submittedForms').onSnapshot(s => {
                        let arr = []; s.forEach(d => arr.push(d.data()));
                        setSubmittedForms(arr);
                    }, (err) => console.error(err));
                    
                    // Tải nhật ký hệ thống
                    rootRef.collection('messages').onSnapshot(s => {
                        let arr = []; s.forEach(d => arr.push(d.data()));
                        setMessages(arr.sort((a,b)=>b.id-a.id));
                    }, (err) => console.error(err));
                    
                    // Tải cấu hình chung của hệ thống
                    rootRef.collection('systemConfigs').doc('global').onSnapshot(doc => {
                        if (doc.exists) {
                            const data = doc.data();
                            setAppConfigs(prev => ({ ...prev, ...data }));
                            if (data.weekRanges) {
                                const keys = Object.keys(data.weekRanges);
                                if (keys.length > 0 && !selectedWeek) setSelectedWeek(keys[0]);
                            }
                        }
                    }, (err) => console.error(err));
                };
                initData();
            }, [user, sdkReady]);

            // Tính năng bảo mật tự động đăng xuất
            useEffect(() => {
                if (appConfigs.logoutTime === "Never" || !loggedInUser) return;
                let mins = appConfigs.logoutTime === "30m" ? 30 : 60;
                setSecondsLeft(mins * 60);
                const timer = setInterval(() => {
                    setSecondsLeft(p => {
                        if (p <= 1) { 
                            setLoggedInUser(null); 
                            showToast("Đã tự động đăng xuất để đảm bảo bảo mật."); 
                            return 0; 
                        }
                        return p - 1;
                    });
                }, 1000);
                const reset = () => setSecondsLeft(mins * 60);
                window.addEventListener("click", reset); window.addEventListener("keydown", reset);
                return () => { 
                    clearInterval(timer); 
                    window.removeEventListener("click", reset); 
                    window.removeEventListener("keydown", reset); 
                }
            }, [appConfigs.logoutTime, loggedInUser]);

            const showToast = (txt) => {
                const id = Date.now(); setToasts(p => [...p, {id, txt}]);
                setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 4000);
            };

            const removeToast = (id) => {
                setToasts(p => p.filter(t => t.id !== id));
            };

            const triggerConfirm = (title, message, cb) => setConfirmState({ isOpen: true, title, message, onConfirm: () => { cb(); setConfirmState({isOpen:false}); } });

            const logMessage = async (txt, formId = null) => {
                if (!sdkReady || !user) return;
                const db = firebase.firestore();
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('messages').doc(String(Date.now())).set({
                    id: Date.now(), text: txt, time: new Date().toLocaleTimeString(), formId
                });
            }

            // Giải phóng bộ nhớ ứng dụng (Admin feature)
            const handleClearDatabase = () => {
                triggerConfirm(
                    "Giải phóng bộ nhớ ứng dụng?",
                    "Hành động này sẽ xóa các công việc đã HOÀN THÀNH để dọn dẹp hệ thống. Bạn có chắc chắn muốn thực hiện?",
                    async () => {
                        const db = firebase.firestore();
                        const rootRef = db.collection('artifacts').doc(appId).collection('public').doc('data');
                        const finishedTasks = tasks.filter(t => t.status === "hoàn thành");
                        
                        let count = 0;
                        for (const t of finishedTasks) {
                            await rootRef.collection('tasks').doc(t.id).delete();
                            count++;
                        }
                        await logMessage(`Admin đã giải phóng bộ nhớ, dọn dẹp ${count} công việc hoàn thành.`);
                        showToast(`Giải phóng thành công ${count} công việc!`);
                    }
                );
            };

            // Hàm tính điểm KPI dựa trên barem % hoàn thành (70% Công việc + 30% Thái độ)
            const getEmployeeKPI = (empId) => {
                const att = attitudes[empId] || { sup: 5, att: 5, init: 5, praise: 5 };
                const totalAttitude = Number(att.sup) + Number(att.att) + Number(att.init) + Number(att.praise); // Tối đa 20 điểm
                
                const empTasks = tasks.filter(t => t.assignees && t.assignees.includes(empId));
                if (empTasks.length === 0) return { completion: 100, taskCount: 0, attitude: totalAttitude, tasks: [], finalScore: 100 };

                let totalWeight = 0, earnedWeight = 0;
                empTasks.forEach(t => {
                    totalWeight += 10;
                    if (t.status === "hoàn thành") earnedWeight += 10;
                    else if (t.status === "đang làm") earnedWeight += 5;
                    else if (t.status === "làm lại") earnedWeight += 2;
                    else if (t.status === "bàn giao") earnedWeight += 0;
                });
                
                const completion = Math.round((earnedWeight / totalWeight) * 100);
                const finalScore = Math.round((completion * 0.7) + ((totalAttitude / 20 * 100) * 0.3));
                
                return { completion, taskCount: empTasks.length, attitude: totalAttitude, tasks: empTasks, finalScore, rawAttitude: att };
            };

            // Các kỷ lục thành tích hiển thị trên Dashboard
            const getAdvancedStats = () => {
                let maxCompleted = 0; let bestCompletedEmp = null;
                let maxHandover = 0; let bestHandoverEmp = null;
                let maxInOneShift = 0; let bestInOneShiftEmp = null;
                let maxHandoverInOneShift = 0; let bestHandoverInOneShiftEmp = null;
                let maxAtt = 0; let bestAttEmp = null;

                employees.filter(e => e.id !== "ADMIN" && e.active).forEach(emp => {
                    const empTasks = tasks.filter(t => t.assignees?.includes(emp.id));
                    const completedTasks = empTasks.filter(t => t.status === "hoàn thành");
                    const handoverTasks = empTasks.filter(t => t.status === "bàn giao");

                    if (completedTasks.length > maxCompleted) { maxCompleted = completedTasks.length; bestCompletedEmp = emp; }
                    if (handoverTasks.length > maxHandover) { maxHandover = handoverTasks.length; bestHandoverEmp = emp; }

                    const shiftCounts = {};
                    const handoverShiftCounts = {};
                    empTasks.forEach(t => {
                        const key = `${t.date}_${t.shift}`;
                        if (t.status === "hoàn thành") shiftCounts[key] = (shiftCounts[key] || 0) + 1;
                        if (t.status === "bàn giao") handoverShiftCounts[key] = (handoverShiftCounts[key] || 0) + 1;
                    });

                    const maxShift = Math.max(0, ...Object.values(shiftCounts).concat(0));
                    if (maxShift > maxInOneShift) { maxInOneShift = maxShift; bestInOneShiftEmp = emp; }

                    const maxHShift = Math.max(0, ...Object.values(handoverShiftCounts).concat(0));
                    if (maxHShift > maxHandoverInOneShift) { maxHandoverInOneShift = maxHShift; bestHandoverInOneShiftEmp = emp; }

                    const att = attitudes[emp.id] || {sup:5,att:5,init:5,praise:5};
                    const tot = Number(att.sup)+Number(att.att)+Number(att.init)+Number(att.praise);
                    if (tot > maxAtt) { maxAtt = tot; bestAttEmp = emp; }
                });

                return {
                    bestCompletedEmp, maxCompleted,
                    bestHandoverEmp, maxHandover,
                    bestInOneShiftEmp, maxInOneShift,
                    bestHandoverInOneShiftEmp, maxHandoverInOneShift,
                    bestAttEmp, maxAtt
                };
            };

            const handleUpdateTask = async (id, field, val) => {
                if (!sdkReady) return;
                const db = firebase.firestore();
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('tasks').doc(id).update({ [field]: val });
            };

            const handleAddTask = async (date) => {
                if (!sdkReady) return;
                const db = firebase.firestore();
                const newId = `T-${Date.now()}`;
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('tasks').doc(newId).set({
                    id: newId, date: date || new Date().toISOString().split('T')[0], shift: "Ca A", group: "Vận hành", area: "",
                    title: "", titleColor: "#0f172a", titleSize: "text-sm", assignees: [], status: "đang làm",
                    note: "", noteColor: "#0f172a", formLink: "", linkUrl: "", images: [], createdAt: Date.now()
                });
            };

            // Chèn dòng công việc phát sinh ngay bên dưới dòng hiện tại (yêu cầu tệp Word)
            const handleInsertTaskBelow = async (baseTask) => {
                if (!sdkReady) return;
                const db = firebase.firestore();
                const newId = `T-${Date.now()}`;
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('tasks').doc(newId).set({
                    id: newId, 
                    date: baseTask.date, 
                    shift: baseTask.shift, 
                    group: baseTask.group, 
                    area: baseTask.area || "",
                    title: "", 
                    titleColor: "#0f172a", 
                    titleSize: "text-sm", 
                    assignees: [], 
                    status: "đang làm",
                    note: "", 
                    noteColor: "#0f172a", 
                    formLink: "", 
                    linkUrl: "", 
                    images: [], 
                    createdAt: Date.now()
                });
                showToast("Đã chèn thêm dòng việc phát sinh!");
            };

            // Phân lại ca cho việc tồn đọng (yêu cầu tệp Word)
            const handleReassignSubmit = async () => {
                if (!sdkReady || !reassignTask) return;
                const db = firebase.firestore();
                
                // Cập nhật công việc với Ngày, Ca, Nhóm và Nhân sự mới
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('tasks').doc(reassignTask.id).update({
                    date: reassignDate,
                    shift: reassignShift,
                    group: reassignGroup,
                    assignees: reassignAssignees,
                    status: "đang làm" // Khôi phục trạng thái làm việc tại ca trực mới
                });

                await logMessage(`Đã dời việc [${reassignTask.title || 'Không có tiêu đề'}] sang Ngày ${reassignDate}, ${reassignShift}, giao cho ${reassignAssignees.map(id => employees.find(e => e.id === id)?.name).join(", ")}`);
                showToast("Đã phân phối lại công việc sang ca trực mới!");
                setReassignTask(null);
            };

            if (!sdkReady || !user) return <div className="h-screen flex justify-center items-center font-bold text-slate-500 bg-slate-900">Đang khởi tạo liên kết Đám mây...</div>;

            // Màn hình Đăng nhập
            if (!loggedInUser) {
                return (
                    <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md border-t-8 border-blue-600 animate-scaleUp">
                            <h2 className="text-2xl font-black text-slate-800 text-center mb-1">KPI & TASK MANAGER</h2>
                            <p className="text-sm text-slate-500 text-center mb-8 font-medium">Bảo mật đa tầng - Đồng bộ thời gian thực</p>
                            <form onSubmit={e => {
                                e.preventDefault();
                                const u = e.target.username.value; const p = e.target.password.value;
                                const matched = employees.find(emp => emp.id === u && emp.password === p);
                                if (matched) { 
                                    setLoggedInUser(matched); 
                                    setActiveTab(matched.role === "Admin" ? "admin" : "weekly-plan"); 
                                    logMessage(`${matched.name} (${matched.role}) đăng nhập.`); 
                                }
                                else showToast("Tài khoản hoặc mật khẩu trực chưa chính xác!");
                            }} className="space-y-4">
                                <select name="username" className="w-full border-2 rounded-xl p-3 font-bold text-slate-700 outline-none focus:border-blue-500" required>
                                    <option value="">-- Chọn Nhân Sự Đăng Nhập --</option>
                                    {employees.map(e => <option key={e.id} value={e.id}>{e.name} ({e.role})</option>)}
                                </select>
                                <input name="password" type="password" placeholder="Nhập mật khẩu..." className="w-full border-2 rounded-xl p-3 font-bold outline-none focus:border-blue-500" required />
                                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl shadow-lg transition">ĐĂNG NHẬP HỆ THỐNG</button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (appConfigs.isPaused && loggedInUser.role !== "Admin") {
                return <div className="h-screen flex flex-col justify-center items-center font-bold text-rose-600 text-xl bg-slate-100">Hệ thống đang được Admin tạm ngưng để bảo trì.</div>;
            }

            const isAdmin = loggedInUser.role === "Admin";
            const canEditTasks = isAdmin || ["Duty Engineer", "Duty Manager", "Technician", "Senior Technician", "Carpenter"].includes(loggedInUser.role);

            const wData = appConfigs.weekRanges[selectedWeek] || { start: "2026-06-01", end: "2026-06-07" };
            const sortedTasks = [...tasks].sort((a,b) => a.date.localeCompare(b.date) || a.shift.localeCompare(b.shift));
            const planTasks = sortedTasks.filter(t => t.date >= wData.start && t.date <= wData.end && (!selectedDate || t.date === selectedDate));
            
            // Công việc tồn đọng tự động: ngày trong quá khứ và chưa xong (yêu cầu tệp Word)
            const todayStr = new Date().toISOString().split('T')[0];
            const backlogTasks = sortedTasks.filter(t => t.date < todayStr && ["đang làm", "bàn giao", "làm lại"].includes(t.status));

            // Hàm vẽ biểu đồ phối hợp Cột + Đường (Recharts) theo yêu cầu chi tiết
            const renderCustomBarChart = (roleFilters) => {
                if (!window.Recharts || !window.Recharts.ComposedChart) {
                    return <div className="p-4 text-center text-rose-500 font-bold border rounded bg-rose-50">Không tải được biểu đồ Recharts offline. Vui lòng kiểm tra lại mạng.</div>;
                }
                const { ComposedChart, Bar, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, Cell, LabelList } = window.Recharts;
                
                const data = employees
                    .filter(e => roleFilters.includes(e.role) && e.active && e.id !== "ADMIN")
                    .map(e => {
                        const kpi = getEmployeeKPI(e.id);
                        return { name: e.name, count: kpi.taskCount, percent: kpi.completion };
                    })
                    .sort((a, b) => b.percent - a.percent); // Sắp xếp giảm dần theo % từ trái sang phải

                // Barem màu sắc cột biểu đồ chính xác theo yêu cầu
                const getBarColor = (pct) => {
                    if (pct >= 99) return "#ef4444"; // Đỏ (Xuất sắc)
                    if (pct >= 95) return "#22c55e"; // Xanh lá (Giỏi)
                    if (pct >= 90) return "#f97316"; // Cam (Khá)
                    if (pct >= 70) return "#3b82f6"; // Xanh dương (Trung bình)
                    return "#94a3b8"; // Xám (Dưới 70%)
                };

                return (
                    <div className="h-80 w-full mt-4 bg-white p-4 rounded-xl border">
                        <ResponsiveContainer width="100%" height="100%">
                            <ComposedChart data={data} margin={{ top: 20, right: 20, bottom: 20, left: 0 }}>
                                <CartesianGrid stroke="#f1f5f9" strokeDasharray="5 5" />
                                <XAxis dataKey="name" tick={{fontSize: 10, fontWeight: 'bold'}} interval={0} />
                                <YAxis yAxisId="left" tick={{fontSize: 10}} label={{ value: 'Số lượng công việc', angle: -90, position: 'insideLeft', style: {fontSize: 10, fontWeight: 'bold'} }} />
                                <YAxis yAxisId="right" orientation="right" tickFormatter={(v)=>`${v}%`} tick={{fontSize: 10, fill: '#ef4444'}} domain={[0, 100]} label={{ value: '% Hoàn thành', angle: 90, position: 'insideRight', style: {fontSize: 10, fontWeight: 'bold', fill: '#ef4444'} }} />
                                <Tooltip contentStyle={{ borderRadius: '8px', fontWeight: 'bold' }} />
                                <Legend wrapperStyle={{ paddingTop: '10px', fontWeight: 'bold', fontSize: 12 }} />
                                <Bar yAxisId="left" dataKey="count" name="Số công việc phụ trách" barSize={35} radius={[4,4,0,0]}>
                                    {data.map((entry, index) => (
                                        <Cell key={`cell-${index}`} fill={getBarColor(entry.percent)} />
                                    ))}
                                    <LabelList dataKey="count" position="top" style={{fill: '#0f172a', fontWeight: 'bold', fontSize: 11}} />
                                </Bar>
                                <Line yAxisId="right" type="monotone" dataKey="percent" name="% Hoàn thành công việc" stroke="#ef4444" strokeWidth={3} dot={{r: 5, fill: '#ef4444', strokeWidth: 2, stroke: '#fff'}} />
                            </ComposedChart>
                        </ResponsiveContainer>
                    </div>
                );
            };

                            <tr className={`border-b font-extrabold uppercase text-[10px] tracking-wide ${isBacklog ? 'bg-rose-100 text-rose-900' : 'bg-slate-200 text-slate-800'}`}>

                                <th className="p-3 border-r">Ca</th>
                                <th className="p-3 border-r">Nhóm</th>

                                <th className="p-3 border-r w-64">Nội dung công việc</th>
                                <th className="p-3 border-r text-center">Ảnh minh chứng</th>
                                <th className="p-3 border-r w-44">Người thực hiện</th>
                                <th className="p-3 border-r text-center w-32">Tiến độ</th>
                                <th className="p-3 border-r w-48">Ghi chú</th>

                                    {/* Cột Ca làm việc */}
                                    <td className="p-2 border-r font-bold">

                                            <option value="Ca A">Ca A</option>
                                            <option value="Ca B">Ca B</option>
                                            <option value="Ca C">Ca C</option>
                                            <option value="Ca N">Ca N</option>

                                            <option value="Bảo trì">Bảo trì</option>
                                            <option value="Carpenter">Carpenter</option>
                                        </select>
                                    </td>
                                    {/* Cột Khu vực */}

                                    </td>
                                    {/* Cột Nội dung công việc */}

                                                        <select value={task.titleSize || 'text-sm'} onChange={e=>handleUpdateTask(task.id,'titleSize',e.target.value)} className="text-[10px] font-bold outline-none border rounded px-1 bg-white">

                                                            <option value="text-sm">Chữ Lớn</option>
                                                            <option value="text-base">Khẩn Cấp</option>
                                                        </select>

                                                    {/* Nút liên kết Form bảo trì / Google Sheets */}

                                                            <div className="max-h-32 overflow-y-auto custom-scrollbar">
                                                                {formTemplates.filter(f=>f.name.toLowerCase().includes(searchFormInput.toLowerCase())).map(f => (

                                                                ))}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}
                                            {task.formLink && (
                                                <div className="flex justify-between items-center bg-blue-50 p-1.5 rounded mt-1 border border-blue-200 shadow-sm">
                                                    <span className="text-[10px] font-black text-blue-800 truncate" title={formTemplates.find(f=>f.id===task.formLink)?.name}>
                                                        <i className="fa-solid fa-file-invoice"></i> {formTemplates.find(f=>f.id===task.formLink)?.name || "Lỗi Form"}
                                                    </span>
                                                    <button onClick={()=>{
                                                        const tpl = formTemplates.find(f=>f.id===task.formLink);
                                                        if(tpl) {
                                                            const initialResp = {}; const initialChecks = {};
                                                            tpl.fields.forEach(f => {
                                                                initialResp[f.label] = "";
                                                                initialChecks[f.label] = (f.options ? f.options.split(",")[0] : "");
                                                            });
                                                            setFormResponses(initialResp); setFormChecks(initialChecks);
                                                            setActiveFormTemplate(tpl);
                                                            setActiveTab('forms');
                                                        }
                                                    }} className="bg-blue-600 hover:bg-blue-700 text-white px-2 py-0.5 rounded text-[10px] font-bold shadow transition">Điền Form</button>
                                                </div>
                                            )}
                                        </div>
                                    </td>
                                    {/* Cột Ảnh minh chứng */}
                                    <td className="p-2 border-r text-center">
                                        <div className="flex flex-col gap-1 items-center">
                                            <div className="flex flex-wrap gap-1 justify-center">
                                                {task.images?.map((img, i) => <img key={i} src={img} className="w-9 h-9 object-cover rounded cursor-zoom-in border hover:scale-105 transition shadow-sm" onClick={()=>setLightboxImage(img)} />)}
                                            </div>
                                            {canEditTasks && (
                                                <label className="text-[9px] bg-slate-100 hover:bg-slate-200 border px-1.5 py-0.5 rounded cursor-pointer font-bold block mt-1">+ Thêm Minh Chứng
                                                    <input type="file" multiple accept="image/*" hidden onChange={e=>{
                                                        Array.from(e.target.files).forEach(file => {
                                                            const reader = new FileReader();
                                                            reader.onloadend = () => handleUpdateTask(task.id, 'images', [...(task.images||[]), reader.result]);
                                                            reader.readAsDataURL(file);
                                                        });
                                                    }} />
                                                </label>
                                            )}
                                        </div>
                                    </td>
                                    {/* Cột Người làm (Đầy đủ họ tên) */}
                                    <td className="p-2 border-r relative group">
                                        <div className="bg-white border p-1 rounded text-[11px] font-bold min-h-[30px] cursor-pointer hover:bg-slate-50 flex items-center justify-between">
                                            <span className="truncate">{task.assignees?.map(id => employees.find(e=>e.id===id)?.name).join(", ") || "Chọn người làm..."}</span>
                                            <i className="fa-solid fa-caret-down text-slate-400"></i>
                                        </div>
                                        {canEditTasks && (
                                            <div className="absolute left-0 top-full mt-1 bg-white border shadow-xl p-2 rounded hidden group-hover:block z-40 w-48 max-h-48 overflow-y-auto custom-scrollbar text-slate-900">
                                                {employees.filter(e=>e.id!=="ADMIN").map(e => (
                                                    <label key={e.id} className="flex items-center gap-2 text-[11px] font-bold p-1.5 hover:bg-slate-100 cursor-pointer">
                                                        <input type="checkbox" checked={task.assignees?.includes(e.id)} onChange={()=>{
                                                            let arr = task.assignees || [];
                                                            if (arr.includes(e.id)) arr = arr.filter(id => id !== e.id); else arr.push(e.id);
                                                            handleUpdateTask(task.id, 'assignees', arr);
                                                        }} className="accent-blue-600 rounded" /> {e.name}
                                                    </label>
                                                ))}
                                            </div>
                                        )}
                                    </td>
                                    {/* Cột Tiến độ (Barem chuẩn: Xong 10đ, Đang làm 5đ, Làm lại 2đ, Bàn giao 0đ) */}
                                    <td className="p-2 border-r font-bold">
                                        <select value={task.status} disabled={!canEditTasks} onChange={e => handleUpdateTask(task.id, 'status', e.target.value)} 
                                            className={`w-full outline-none p-1.5 rounded text-center text-[11px] font-black border-none cursor-pointer shadow-sm
                                            ${task.status==='hoàn thành'?'bg-emerald-100 text-emerald-800': task.status==='làm lại'?'bg-rose-100 text-rose-800': task.status==='đang làm'?'bg-amber-100 text-amber-800':'bg-slate-100 text-slate-700'}`}>
                                            <option value="đang làm">ĐANG LÀM</option>
                                            <option value="hoàn thành">XONG</option>
                                            <option value="bàn giao">BÀN GIAO</option>
                                            <option value="làm lại">LÀM LẠI</option>
                                        </select>
                                    </td>
                                    {/* Cột Ghi chú */}
                                    <td className="p-2 border-r">
                                        <div className="flex flex-col gap-1">
                                            <textarea value={task.note} disabled={!canEditTasks} onChange={e => handleUpdateTask(task.id, 'note', e.target.value)} className="w-full bg-transparent resize-y outline-none font-semibold text-[11px] whitespace-pre-wrap break-words leading-relaxed custom-scrollbar" style={{color: task.noteColor || '#0f172a'}} rows={3} placeholder="Ghi chú ca trực..." />
                                            {canEditTasks && (
                                                <div className="flex gap-1.5 items-center mt-1 pt-1 border-t border-dashed">
                                                    <input type="color" value={task.noteColor || '#0f172a'} onChange={e=>handleUpdateTask(task.id, 'noteColor', e.target.value)} className="w-4 h-4 cursor-pointer border rounded" />
                                                    <input type="text" placeholder="Link ngoài (Sheets...)" value={task.linkUrl || ""} onChange={e=>handleUpdateTask(task.id, 'linkUrl', e.target.value)} className="w-full text-[10px] border rounded px-1.5 py-0.5 outline-none bg-white" />
                                                    {task.linkUrl && <a href={task.linkUrl} target="_blank" rel="noopener noreferrer" className="text-blue-600 hover:text-blue-800 bg-blue-50 p-0.5 rounded"><i className="fa-solid fa-arrow-up-right-from-square"></i></a>}
                                                </div>
                                            )}
                                        </div>
                                    </td>
                                    {/* Cột Thao Tác (Chèn việc phát sinh, Xóa việc) */}
                                    {canEditTasks && (
                                        <td className="p-2 text-center space-y-1">
                                            {isBacklog ? (
                                                <button onClick={() => {
                                                    setReassignTask(task);
                                                    setReassignDate(todayStr);
                                                    setReassignShift(task.shift);
                                                    setReassignGroup(task.group);
                                                    setReassignAssignees(task.assignees || []);
                                                }} className="bg-amber-500 hover:bg-amber-600 text-white text-[10px] py-1 px-2 rounded font-bold w-full shadow-sm"><i className="fa-solid fa-arrows-spin mr-1"></i>Phân lại ca</button>
                                            ) : (
                                                <button onClick={() => handleInsertTaskBelow(task)} className="text-emerald-600 hover:text-emerald-800 text-[10px] px-2 block w-full text-left font-bold border border-transparent hover:border-emerald-200 rounded" title="Chèn dòng bên dưới"><i className="fa-solid fa-plus mr-1"></i>Việc phát sinh</button>
                                            )}
                                            <button onClick={()=>triggerConfirm("Xóa việc?", "Xóa công việc này khỏi hệ thống vĩnh viễn?", ()=> {
                                                firebase.firestore().collection('artifacts').doc(appId).collection('public').doc('data').collection('tasks').doc(task.id).delete();
                                            })} className="text-rose-500 hover:text-rose-700 text-[10px] px-2 block w-full text-left font-bold border border-transparent hover:border-rose-200 rounded"><i className="fa-solid fa-trash-can mr-1"></i>Xóa việc</button>
                                        </td>
                                    )}
                                </tr>
                            ))}
                            {canEditTasks && !isBacklog && (
                                <tr><td colSpan="10" className="p-3 bg-slate-50 text-center border-b">
                                    <button onClick={()=>handleAddTask(selectedDate)} className="bg-emerald-100 text-emerald-700 hover:bg-emerald-200 font-extrabold px-6 py-2.5 rounded-xl text-xs shadow-sm transition"><i className="fa-solid fa-plus mr-1"></i> THÊM CÔNG VIỆC MỚI VÀO NGÀY ĐANG LỌC</button>

                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 p-2 rounded-lg font-black text-xl"><i className="fa-solid fa-chart-line"></i></div>

        function SignaturePad({ title, onSave, onClear, savedImage }) {
            const canvasRef = useRef(null); const [isDrawing, setIsDrawing] = useState(false);
            useEffect(() => { const ctx = canvasRef.current?.getContext('2d'); if(ctx){ ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.strokeStyle = '#1e3a8a'; } }, [savedImage]);
            const getMousePos = (e) => { const rect = canvasRef.current.getBoundingClientRect(); const clientX = e.clientX || (e.touches && e.touches[0].clientX); const clientY = e.clientY || (e.touches && e.touches[0].clientY); return { x: clientX - rect.left, y: clientY - rect.top }; };
            const startDrawing = (e) => { const pos = getMousePos(e); const ctx = canvasRef.current.getContext('2d'); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); setIsDrawing(true); };
            const draw = (e) => { if (!isDrawing) return; if (e.cancelable) e.preventDefault(); const pos = getMousePos(e); const ctx = canvasRef.current.getContext('2d'); ctx.lineTo(pos.x, pos.y); ctx.stroke(); };
            const stopDrawing = () => { if (!isDrawing) return; setIsDrawing(false); onSave(canvasRef.current.toDataURL()); };
            const clearCanvas = () => { canvasRef.current.getContext('2d').clearRect(0, 0, 150, 80); onClear(); };
            return (
                <div className="border border-slate-200 rounded-xl p-3 bg-white text-center flex flex-col items-center shadow-sm">
                    <span className="font-black text-slate-600 block mb-2 text-[10px] uppercase tracking-wider">{title}</span>
                    <div className="w-[150px] h-[80px] bg-slate-50 border-2 border-dashed rounded-lg relative overflow-hidden flex items-center justify-center">
                        <canvas ref={canvasRef} width={150} height={80} onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseLeave={stopDrawing} onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing} style={{ touchAction: 'none' }} className="absolute top-0 left-0 w-full h-full cursor-crosshair" />
                    </div>
                    <button type="button" onClick={clearCanvas} className="text-[10px] text-rose-500 font-bold mt-2 hover:underline">Xóa Ký Lại</button>
                </div>
            );
        }

                        <div key={t.id} className="bg-slate-950 text-white px-5 py-3.5 rounded-xl shadow-2xl font-bold text-xs pointer-events-auto border border-slate-800 flex justify-between items-center gap-4 animate-scaleUp">
                            <span>{t.txt}</span>
                            <button onClick={()=>removeToast(t.id)} className="text-slate-400 hover:text-white"><i className="fa-solid fa-xmark"></i></button>
                        </div>
                    ))}
                </div>
            );
        }

        function ConfirmModal({ isOpen, title, message, onConfirm, onCancel }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex justify-center items-center z-[100] p-4 no-print text-slate-900">
                    <div className="bg-white p-6 rounded-2xl shadow-2xl max-w-sm text-center animate-scaleUp border border-slate-200">
                        <div className="text-rose-500 text-4xl mb-3"><i className="fa-solid fa-circle-exclamation"></i></div>
                        <h3 className="font-black text-lg mb-2">{title}</h3>
                        <p className="text-xs text-slate-500 mb-6 font-semibold leading-relaxed">{message}</p>
                        <div className="flex gap-3 justify-center">
                            <button onClick={onCancel} className="bg-slate-100 font-bold px-5 py-2.5 rounded-xl text-xs hover:bg-slate-200 transition">Hủy bỏ</button>
                            <button onClick={onConfirm} className="bg-blue-600 text-white font-bold px-5 py-2.5 rounded-xl text-xs hover:bg-blue-700 shadow-md transition">Đồng ý</button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
